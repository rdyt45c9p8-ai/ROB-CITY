const shopOverlay = document.getElementById('shopOverlay');
const shopListEl = document.getElementById('shopList');
const shopCloseBtn = document.getElementById('shopCloseBtn');

function openShop(){
  shopping = true;
  renderShopList();
  shopOverlay.classList.add('show');
}
function closeShop(){
  shopping = false;
  shopOverlay.classList.remove('show');
}
shopCloseBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); closeShop(); });

function renderShopList(){
  document.getElementById('shopMoneyLine').textContent = '所持金 $' + (creativeMode ? '∞' : money.toLocaleString());
  shopListEl.innerHTML = '';
  WEAPON_KEYS.forEach(key => {
    const w = WEAPONS[key];
    const row = document.createElement('div');
    row.className = 'shopRow';
    const isOwned = owned[key];
    const ammoCost = w.ammoPrice * w.ammoPack;
    const ammoFull = isOwned && ammo[key] >= w.ammoMax;
    row.innerHTML = `
      <div class="shopRowTitle">
        <span>${w.label}</span>
        <span>${isOwned ? ('弾 ' + ammo[key] + '/' + w.ammoMax) : ('$' + w.price.toLocaleString())}</span>
      </div>
      <div class="shopBtnRow">
        <div class="shopBtn buy-weapon ${isOwned ? 'disabled' : ''}" data-key="${key}">
          ${isOwned ? '所持済み' : ('購入 $' + w.price.toLocaleString())}
        </div>
        <div class="shopBtn ammo buy-ammo ${(!isOwned || ammoFull) ? 'disabled' : ''}" data-key="${key}">
          弾薬+${w.ammoPack} ($${ammoCost.toLocaleString()})
        </div>
      </div>`;
    shopListEl.appendChild(row);
  });
  shopListEl.querySelectorAll('.buy-weapon').forEach(btn => {

      e.preventDefault();
      buyWeapon(btn.getAttribute('data-key'));
    });
  });
  shopListEl.querySelectorAll('.buy-ammo').forEach(btn => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      buyAmmo(btn.getAttribute('data-key'));
    });
  });
}

function buyWeapon(key){
  const w = WEAPONS[key];
  if (owned[key]) return;
  if (!creativeMode){
    if (money < w.price) return;
    money -= w.price;
  }
  owned[key] = true;
  ammo[key] = creativeMode ? w.ammoMax : Math.floor(w.ammoPack/2);
  updateMoneyUI();
  setMessage(w.label + ' を購入した！', 1400);
  renderShopList();
}
function buyAmmo(key){
  const w = WEAPONS[key];
  if (!owned[key]) return;
  if (ammo[key] >= w.ammoMax) return;
  if (!creativeMode){
    const cost = w.ammoPrice * w.ammoPack;
    if (money < cost) return;
    money -= cost;
  }
  ammo[key] = Math.min(w.ammoMax, ammo[key] + (creativeMode ? w.ammoMax : w.ammoPack));
  updateMoneyUI();
  updateAmmoUI();
  setMessage(w.label + 'の弾薬を購入した', 1200);
  renderShopList();
}

function updatePlayerFoot(dt){
  if (player.robbing || shopping || adminOverlay.classList.contains('show')){
    player.speed = 0;
  } else {
    const turnSpeed = 3.2;
    player.heading -= input.steer * turnSpeed * dt;
    const targetSpeed = Math.max(0, input.throttle) * 5.5 + Math.min(0, input.throttle) * 2.5;
    player.speed += (targetSpeed - player.speed) * Math.min(1, dt*8);

    const dx = Math.sin(player.heading) * player.speed * dt;
    const dz = Math.cos(player.heading) * player.speed * dt;
    collideAndMove(player.pos, dx, dz, player.radius);
  }

  player.mesh.position.set(player.pos.x, 0, player.pos.z);
  player.mesh.rotation.y = player.heading;
  animateWalk(player, dt, 5.5);

  // find nearest interactable (car to enter, robbable shop/bank, gun shop, or plane) for context button
  let best = null, bestD = 4.5, bestType = null;
  if (!player.robbing && !shopping){
    cars.forEach(c => {
      if (c.occupied) return;
      const d = Math.hypot(c.pos.x-player.pos.x, c.pos.z-player.pos.z);
      if (d < bestD){ bestD = d; best = c; bestType = 'car'; }
    });
    trafficCars.forEach(c => {
      const d = Math.hypot(c.pos.x-player.pos.x, c.pos.z-player.pos.z);
      if (d < bestD){ bestD = d; best = c; bestType = 'trafficCar'; }
    });
    patrolVehicles.forEach(v => {
      const d = Math.hypot(v.pos.x-player.pos.x, v.pos.z-player.pos.z);
      if (d < bestD){ bestD = d; best = v; bestType = 'patrolCar'; }
    });
    shops.forEach(s => {
      if (s.robbed || s.robbing) return;
      const d = Math.hypot(s.pos.x-player.pos.x, s.pos.z-player.pos.z);
      if (d < Math.max(bestD, s.radius)){ bestD = d; best = s; bestType = 'shop'; }
    });
    if (insideGunShop){
      const dCounter = Math.hypot(GUNSHOP_COUNTER.x-player.pos.x, GUNSHOP_COUNTER.z-player.pos.z);
      if (dCounter < Math.max(bestD, 2.6)){ bestD = dCounter; best = {}; bestType = 'shopcounter'; }
      const dExit = Math.hypot(GUNSHOP_DOOR_INSIDE.x-player.pos.x, GUNSHOP_DOOR_INSIDE.z-player.pos.z);
      if (dExit < Math.max(bestD, 3)){ bestD = dExit; best = {}; bestType = 'shopexit'; }
    } else if (insidePoliceStation){
      const dExit = Math.hypot(STATION_DOOR_INSIDE.x-player.pos.x, STATION_DOOR_INSIDE.z-player.pos.z);
      if (dExit < Math.max(bestD, 3.5)){ bestD = dExit; best = {}; bestType = 'stationexit'; }
    } else if (insideBank){
      if (activeBankBranch && !activeBankBranch.robbed && !activeBankBranch.robbing){
        const dVault = Math.hypot(BANK_VAULT.x-player.pos.x, BANK_VAULT.z-player.pos.z);
        if (dVault < Math.max(bestD, 3.5)){ bestD = dVault; best = activeBankBranch; bestType = 'bankvault'; }
      }
      const dExit = Math.hypot(BANK_DOOR_INSIDE.x-player.pos.x, BANK_DOOR_INSIDE.z-player.pos.z);
      if (dExit < Math.max(bestD, 3.5)){ bestD = dExit; best = {}; bestType = 'bankexit'; }
    } else {
      gunShops.forEach(gs => {
        const d = Math.hypot(gs.pos.x-player.pos.x, gs.pos.z-player.pos.z);
        if (d < Math.max(bestD, gs.radius)){ bestD = d; best = gs; bestType = 'gunshop'; }
      });
      bankBranches.forEach(b => {
        const d = Math.hypot(b.pos.x-player.pos.x, b.pos.z-player.pos.z);
        if (d < Math.max(bestD, b.radius)){ bestD = d; best = b; bestType = 'bankdoor'; }
      });
      const dStation = Math.hypot(POLICE_STATION.x-player.pos.x, (POLICE_STATION.z+7.5)-player.pos.z);
      if (dStation < Math.max(bestD, 5)){ bestD = dStation; best = {}; bestType = 'station'; }
    }
    npcs.forEach(n => {
      if (n.state !== 'walk') return;
      const d = Math.hypot(n.pos.x-player.pos.x, n.pos.z-player.pos.z);
      if (d < 2.3 && d < bestD){ bestD = d; best = n; bestType = 'npc'; }
    });
    if (!playerPlane.occupied){
      const d = Math.hypot(playerPlane.pos.x-player.pos.x, playerPlane.pos.z-player.pos.z);
      if (d < Math.max(bestD, playerPlane.radius)){ bestD = d; best = playerPlane; bestType = 'plane'; }
    }
  }
  nearestInteractable = best ? { type: bestType, obj: best } : null;
  if (nearestInteractable){
    enterBtn.classList.add('show');
    if (nearestInteractable.type === 'car'){
      enterBtn.textContent = 'ENTER';
      setHint('近くの車に乗る');
    } else if (nearestInteractable.type === 'trafficCar' || nearestInteractable.type === 'patrolCar'){
      enterBtn.textContent = 'JACK';
      setHint('走行中の車を奪う');
    } else if (nearestInteractable.type === 'gunshop'){
      enterBtn.textContent = 'ENTER';
      setHint('銃屋に入る');
    } else if (nearestInteractable.type === 'shopcounter'){
      enterBtn.textContent = 'BROWSE';
      setHint('商品を見る');
    } else if (nearestInteractable.type === 'shopexit'){
      enterBtn.textContent = 'EXIT';
      setHint('店を出る');
    } else if (nearestInteractable.type === 'station'){
      enterBtn.textContent = 'ENTER';
      setHint('警察署に入る');
    } else if (nearestInteractable.type === 'stationexit'){
      enterBtn.textContent = 'EXIT';
      setHint('警察署を出る');
    } else if (nearestInteractable.type === 'bankdoor'){
      enterBtn.textContent = 'ENTER';
      setHint('銀行に入る');
    } else if (nearestInteractable.type === 'bankexit'){
      enterBtn.textContent = 'EXIT';
      setHint('銀行を出る');
    } else if (nearestInteractable.type === 'bankvault'){
      enterBtn.textContent = 'ROB VAULT';
      setHint('金庫を強盗する');
    } else if (nearestInteractable.type === 'plane'){
      enterBtn.textContent = 'BOARD';
      setHint('飛行機に搭乗する');
    } else if (nearestInteractable.type === 'npc'){
      enterBtn.textContent = 'TALK';
      setHint('話しかける');
    } else {
      enterBtn.textContent = 'ROB';
      setHint('店を強盗する');
    }
  } else {
    enterBtn.classList.remove('show');
    setHint('');
  }

  document.getElementById('speedVal').textContent = Math.round(Math.abs(player.speed)*8);
}

function updatePlayerCar(dt){
  const car = activeCar;
  const maxSpeed = 22;
  const accel = braking ? -14 : (input.throttle * 12);
  car.speed += accel * dt;
  car.speed *= 0.992; // rolling friction
  if (braking) car.speed *= 0.9;
  car.speed = Math.max(-maxSpeed*0.4, Math.min(maxSpeed, car.speed));

  const turnFactor = Math.max(-1, Math.min(1, car.speed / 6));
  car.heading -= input.steer * 2.1 * dt * turnFactor;

  const dx = Math.sin(car.heading) * car.speed * dt;
  const dz = Math.cos(car.heading) * car.speed * dt;
  collideAndMove(car.pos, dx, dz, car.radius);

  car.mesh.position.set(car.pos.x, 0, car.pos.z);
  car.mesh.rotation.y = car.heading;

  player.pos.x = car.pos.x; player.pos.z = car.pos.z; player.heading = car.heading;

  enterBtn.classList.add('show');
  enterBtn.textContent = 'EXIT';
  setHint('');
  document.getElementById('speedVal').textContent = Math.round(Math.abs(car.speed)*8);
}

function updateNPCs(dt){
  npcs.forEach(n => {
    if (n.state === 'down'){
      n.downTimer -= dt;
      if (n.downTimer <= 0){
        n.state = 'walk';
        n.mesh.rotation.z = 0;
        n.mesh.position.y = 0;
        const ang = Math.random()*Math.PI*2, r = 20+Math.random()*40;
        n.pos.x = player.pos.x + Math.cos(ang)*r;
        n.pos.z = player.pos.z + Math.sin(ang)*r;
        n.pos.x = Math.max(-MAP_HALF, Math.min(MAP_HALF, n.pos.x));
        n.pos.z = Math.max(-MAP_HALF, Math.min(MAP_HALF, n.pos.z));
      }
      return;
    }
    if (n.state === 'riding' || n.state === 'waitingFare') return; // held for the taxi job, don't wander
    // if a civilian has wandered far outside view, recycle them to a spot near the player
    // so the wider map always feels populated without needing thousands of NPCs
    const distToPlayer = Math.hypot(n.pos.x-player.pos.x, n.pos.z-player.pos.z);
    if (distToPlayer > 150){
      const ang = Math.random()*Math.PI*2, r = 40 + Math.random()*100;
      n.pos.x = Math.max(-MAP_HALF, Math.min(MAP_HALF, player.pos.x + Math.cos(ang)*r));
      n.pos.z = Math.max(-MAP_HALF, Math.min(MAP_HALF, player.pos.z + Math.sin(ang)*r));
      n.mesh.position.set(n.pos.x, 0, n.pos.z);
    }
    n.changeTimer -= dt;
    if (n.changeTimer <= 0){
      n.heading = Math.random()*Math.PI*2;
      n.changeTimer = 1.5 + Math.random()*3;
    }
    const dx = Math.sin(n.heading)*n.speed*dt;
    const dz = Math.cos(n.heading)*n.speed*dt;
    if (hitsBuilding(n.pos.x+dx, n.pos.z+dz, n.radius)){
      n.heading += Math.PI*0.5 + Math.random();
    } else {
      n.pos.x += dx; n.pos.z += dz;
      n.pos.x = Math.max(-MAP_HALF, Math.min(MAP_HALF, n.pos.x));
      n.pos.z = Math.max(-MAP_HALF, Math.min(MAP_HALF, n.pos.z));
    }
    n.mesh.position.set(n.pos.x, 0, n.pos.z);
    n.mesh.rotation.y = n.heading;
    animateWalk(n, dt, 1.6);
  });
}

function updateVehicleGroup(list, dt, speedBoost){
  const maxSpeed = (mode === 'car' ? 17 : 12) + (speedBoost || 0);
  list.forEach(p => {
    const dist = Math.hypot(player.pos.x - p.pos.x, player.pos.z - p.pos.z);

    if (p.officers.length > 0){
      // parked while its officers are out chasing on foot; keep lights flashing
      const s = p.mesh.userData.siren;
      if (s){
        s.t += dt;
        const on = Math.floor(s.t*6) % 2 === 0;
        s.red.material.emissiveIntensity = on ? 2 : 0.1;
        s.blue.material.emissiveIntensity = on ? 0.1 : 2;
      }
      return;
    }

    const dx = player.pos.x - p.pos.x, dz = player.pos.z - p.pos.z;
    const targetHeading = Math.atan2(dx, dz);
    let diff = targetHeading - p.heading;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    p.heading += diff * Math.min(1, dt*2.4);

    p.speed += (maxSpeed - p.speed) * Math.min(1, dt*1.6);
    if (dist < 4) p.speed *= 0.8;

    const mx = Math.sin(p.heading) * p.speed * dt;
    const mz = Math.cos(p.heading) * p.speed * dt;
    if (!hitsBuilding(p.pos.x+mx, p.pos.z+mz, p.radius)){
      p.pos.x += mx; p.pos.z += mz;
    } else {
      p.heading += 1.2;
    }
    p.mesh.position.set(p.pos.x, 0, p.pos.z);
    p.mesh.rotation.y = p.heading;

    // siren flash
    const s = p.mesh.userData.siren;
    if (s){
      s.t += dt;
      const on = Math.floor(s.t*6) % 2 === 0;
      s.red.material.emissiveIntensity = on ? 2 : 0.1;
      s.blue.material.emissiveIntensity = on ? 0.1 : 2;
    }

    if (mode === 'foot' && dist < 12){
      deployOfficers(p);
      return;
    }

    const grounded = mode !== 'plane' || playerPlane.altitude < 2;
    if (grounded && bustedCooldown <= 0 && player.invuln <= 0 && dist < (mode==='car' ? 3.4 : 2.4)){
      busted();
    }
  });
}

function updatePolice(dt){
  updateVehicleGroup(police, dt, 0);
  updateVehicleGroup(swatVans, dt, 3);
  updateVehicleGroup(armyVans, dt, 4);
}

function updateOfficers(dt){
  officers.forEach(o => {
    const spd = o.kind === 'army' ? 5.9 : o.kind === 'swat' ? 5.6 : 4.6;
    const dx = player.pos.x - o.pos.x, dz = player.pos.z - o.pos.z;
    const dist = Math.hypot(dx, dz);
    const targetHeading = Math.atan2(dx, dz);
    let diff = targetHeading - o.heading;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    o.heading += diff * Math.min(1, dt*3.2);
    o.speed += (spd - o.speed) * Math.min(1, dt*3);

    const mx = Math.sin(o.heading) * o.speed * dt;
    const mz = Math.cos(o.heading) * o.speed * dt;
    if (!hitsBuilding(o.pos.x+mx, o.pos.z+mz, o.radius)){
      o.pos.x += mx; o.pos.z += mz;
    } else {
      o.heading += 1.3;
    }
    o.mesh.position.set(o.pos.x, 0, o.pos.z);
    o.mesh.rotation.y = o.heading;
    animateWalk(o, dt, spd);

    if (mode === 'foot' && bustedCooldown <= 0 && player.invuln <= 0 &&
        dist < (o.kind === 'army' ? 2.4 : o.kind === 'swat' ? 2.3 : 2.1)){
      busted();
    }
  });
}

function updateWantedDecay(dt){
  if (wanted > 0 && elapsed - lastOffenseTime > 14){
    lastOffenseTime = elapsed - 14 + 4; // stagger decay ticks every 4s
    wanted -= 1;
    updateWantedUI();
    syncForceSpawns();
    if (wanted === 0) setMessage('COOLED DOWN', 1200);
  }
}

let forceRefillTimer = 3;
function updateForceRefill(dt){
  forceRefillTimer -= dt;
  if (forceRefillTimer <= 0){
    forceRefillTimer = 3;
    if (wanted > 0){
      if (police.length < policeCapForWanted(wanted)) spawnVehicle('cop');
      if (swatVans.length < swatCapForWanted(wanted)) spawnVehicle('swat');
      if (armyVans.length < armyCapForWanted(wanted)) spawnVehicle('army');
      if (helicopters.length < heliCapForWanted(wanted)) spawnHelicopter();
    }
  }
}

function updateHelicopters(dt){
  helicopters.forEach((h, idx) => {
    h.phase += dt * 0.5;
    const orbitR = 13 + idx*4;
    const targetX = player.pos.x + Math.cos(h.phase)*orbitR;
    const targetZ = player.pos.z + Math.sin(h.phase)*orbitR;
    const prevX = h.pos.x, prevZ = h.pos.z;
    h.pos.x += (targetX - h.pos.x) * Math.min(1, dt*1.2);
    h.pos.z += (targetZ - h.pos.z) * Math.min(1, dt*1.2);
    const moveX = h.pos.x - prevX, moveZ = h.pos.z - prevZ;
    if (Math.hypot(moveX, moveZ) > 0.001){
      h.heading = Math.atan2(moveX, moveZ);
    }
    h.mesh.position.set(h.pos.x, h.altitude, h.pos.z);
    h.mesh.rotation.y = h.heading;
    h.mesh.userData.rotorGroup.rotation.y += dt * 45;
    h.mesh.userData.tailRotorGroup.rotation.x += dt * 60;
  });
}

let observeMode = false;
let observeAngle = 0;
let viewMode = 'third'; // 'third' | 'first' | 'second'
// ---------------------------------------------------------------------------
// MINIMAP
// ---------------------------------------------------------------------------
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');
const MINIMAP_RADIUS = 190; // world units shown from center to edge
function mmProject(x, z){
  const scale = (minimapCanvas.width/2) / MINIMAP_RADIUS;
  return {
    x: minimapCanvas.width/2 + (x - player.pos.x) * scale,
    y: minimapCanvas.height/2 + (z - player.pos.z) * scale
  };
}
function mmDot(x, z, color, r){
  const p = mmProject(x, z);
  const half = minimapCanvas.width/2;
  const dx = p.x-half, dy = p.y-half;
  if (dx*dx+dy*dy > half*half) return; // outside the circular map, skip
  minimapCtx.fillStyle = color;
  minimapCtx.beginPath();
  minimapCtx.arc(p.x, p.y, r || 3, 0, Math.PI*2);
  minimapCtx.fill();
}
let minimapTimer = 0;
function updateMinimap(dt){
  minimapTimer += dt;
  if (minimapTimer < 0.1) return; // refresh a few times a second, not every frame
  minimapTimer = 0;
  const w = minimapCanvas.width, h = minimapCanvas.height;
  minimapCtx.clearRect(0, 0, w, h);
  // base terrain color: city vs countryside
  const inCity = Math.abs(player.pos.x) < CITY_HALF+40 && Math.abs(player.pos.z) < CITY_HALF+40;
  minimapCtx.fillStyle = inCity ? '#2c2d32' : '#3d5a34';
  minimapCtx.beginPath();
  minimapCtx.arc(w/2, h/2, w/2, 0, Math.PI*2);
  minimapCtx.fill();
  // city boundary ring for orientation
  const cityEdge = mmProject(CITY_HALF, 0);
  minimapCtx.strokeStyle = 'rgba(255,255,255,0.15)';
  minimapCtx.lineWidth = 1;
  minimapCtx.beginPath();
  minimapCtx.arc(w/2, h/2, Math.abs(cityEdge.x - w/2), 0, Math.PI*2);
  minimapCtx.stroke();
  // points of interest
  shops.forEach(s => { if (!s.robbed) mmDot(s.pos.x, s.pos.z, '#ffd23f', 3); });
  bankBranches.forEach(b => { if (!b.robbed) mmDot(b.pos.x, b.pos.z, '#4dc3ff', 3); });
  gunShops.forEach(gs => mmDot(gs.pos.x, gs.pos.z, '#ff5b3b', 3));
  mmDot(MUSEUM_CENTER.x, MUSEUM_CENTER.z, '#c090ff', 3.5);
  mmDot(AIRPORT_POS.x, AIRPORT_POS.z, '#4de1ff', 3.5);
  if (taxiFare){
    const p = hasPassenger ? taxiFare.destination : taxiFare.npc.pos;
    mmDot(p.x, p.z, '#7dff8a', 3.5);
  }
  // active threats
  if (wanted > 0){
    police.concat(swatVans).concat(armyVans).forEach(v => mmDot(v.pos.x, v.pos.z, '#ff3b3b', 2.6));
    officers.forEach(o => mmDot(o.pos.x, o.pos.z, '#ff8a3b', 2.2));
  }
  // player arrow (always centered, points in facing direction)
  minimapCtx.save();
  minimapCtx.translate(w/2, h/2);
  minimapCtx.rotate(player.heading);
  minimapCtx.fillStyle = '#4de1ff';
  minimapCtx.beginPath();
  minimapCtx.moveTo(0, -7);
  minimapCtx.lineTo(5, 6);
  minimapCtx.lineTo(-5, 6);
  minimapCtx.closePath();
  minimapCtx.fill();
  minimapCtx.restore();
}

function updateCamera(dt){
  if (observeMode){
    observeAngle += dt * 0.22;
    const orbitDist = 22, orbitHeight = 13;
    const cx = player.pos.x + Math.sin(observeAngle)*orbitDist;
    const cz = player.pos.z + Math.cos(observeAngle)*orbitDist;
    camera.position.x += (cx - camera.position.x) * Math.min(1, dt*2);
    camera.position.z += (cz - camera.position.z) * Math.min(1, dt*2);
    camera.position.y += (orbitHeight - camera.position.y) * Math.min(1, dt*2);
    camera.lookAt(player.pos.x, 1.5, player.pos.z);
    sky.position.set(player.pos.x, 0, player.pos.z);
    sunDisc.position.set(player.pos.x + 140, 120, player.pos.z + 60);
    return;
  }
  const targetPos = mode === 'car' ? activeCar.pos : player.pos;
  const heading = mode === 'car' ? activeCar.heading : player.heading;
  let baseY = 0;
  if (mode === 'plane') baseY = playerPlane.altitude;
  else if (mode === 'mecha') baseY = mecha.altitude;

  // player's own body only needs hiding for first-person while on foot
  // (car/plane already hide the whole mesh via tryEnterCar/tryEnterPlane).
  // Keep the currently-equipped weapon visible even while the body is hidden.
  if (mode === 'foot'){
    player.mesh.visible = true;
    const hideBody = (viewMode === 'first');
    player.mesh.children.forEach(child => {
      if (WEAPON_MODEL_NAMES.includes(child.name)) return; // managed by setWeaponVisuals
      child.visible = !hideBody;
    });
  }

  if (viewMode === 'first'){
    const eyeHeight = mode === 'car' ? 1.55 : mode === 'plane' ? 1.6 : 1.68;
    const fwd = { x: Math.sin(heading), z: Math.cos(heading) };
    const eyeX = targetPos.x + fwd.x*0.35;
    const eyeZ = targetPos.z + fwd.z*0.35;
    camera.position.x += (eyeX - camera.position.x) * Math.min(1, dt*10);
    camera.position.z += (eyeZ - camera.position.z) * Math.min(1, dt*10);
    camera.position.y += (baseY + eyeHeight - camera.position.y) * Math.min(1, dt*10);
    camera.lookAt(eyeX + fwd.x*10, baseY + eyeHeight, eyeZ + fwd.z*10);
    sky.position.set(player.pos.x, 0, player.pos.z);
    sunDisc.position.set(player.pos.x + 140, 120, player.pos.z + 60);
    return;
  }

  let dist = mode === 'car' ? 11 : 7.5;
  let height = mode === 'car' ? 5.5 : 4.2;
  if (mode === 'plane'){
    dist = 16 + playerPlane.altitude * 0.06;
    height = 6 + playerPlane.altitude * 0.35;
  }
  const behind = viewMode === 'second' ? -1 : 1; // second-person mirrors to the front, looking back at the character
  const camX = targetPos.x - Math.sin(heading)*dist*behind;
  const camZ = targetPos.z - Math.cos(heading)*dist*behind;
  camera.position.x += (camX - camera.position.x) * Math.min(1, dt*4);
  camera.position.z += (camZ - camera.position.z) * Math.min(1, dt*4);
  camera.position.y += (baseY + height - camera.position.y) * Math.min(1, dt*4);
  camera.lookAt(targetPos.x, baseY + 1.3, targetPos.z);
  // keep the skybox/sun centered on the player so they're never left behind
  // on the far edges of the (now much larger) map
  sky.position.set(player.pos.x, 0, player.pos.z);
  sunDisc.position.set(player.pos.x + 140, 120, player.pos.z + 60);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;

  if (player.punchTimer > 0) player.punchTimer -= dt;
  if (player.invuln > 0) player.invuln -= dt;
  if (bustedCooldown > 0) bustedCooldown -= dt;
  if (shootCooldown > 0) shootCooldown -= dt;
  if (mode !== 'mecha' && firingHeld && weaponMode !== 'fist' && WEAPONS[weaponMode].auto && shootCooldown <= 0) doShoot();

  applyKeyboardMovement();
  if (mode === 'foot') updatePlayerFoot(dt);
  else if (mode === 'plane') updatePlayerPlane(dt);
  else if (mode === 'mecha') updateMecha(dt);
  else updatePlayerCar(dt);

  updateRobbery(dt);
  updateShops(dt);
  updateBankAlarm(dt);
  updateCashPickups(dt);
  updateMuseumExhibits(dt);
  updateTaxi(dt);
  updateNPCs(dt);
  updateTrafficLights(dt);
  updateTraffic(dt);
  updatePatrol(dt);
  if (wanted > 0) alertNearbyPatrol();
  updateAutosave(dt);
  updatePolice(dt);
  updateOfficers(dt);
  updateBodyguards(dt);
  updateOfficerCombat(dt);
  updatePlayerHealth(dt);
  updateHelicopters(dt);
  updateSkyPlanes(dt);
  updateClouds(dt);
  updateWantedDecay(dt);
  updateForceRefill(dt);
  updateSunFollow();
  updatePlayerModelAnimation(dt);
  updateCamera(dt);
  updateMinimap(dt);
  updateEngineAudio();
  updateSirenAudio(dt);

  renderer.render(scene, camera);
}

// ---------------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------------
resize();
updateWantedUI();
updateMoneyUI();
updateAmmoUI();
updateHealthUI();
refreshButtonLabels();
document.getElementById('loading').style.display = 'none';

// ---------------------------------------------------------------------------
// SAVE / LOAD (title screen)
// ---------------------------------------------------------------------------
const SAVE_KEY = 'cityRampageSave_v1';
function saveGame(){
  try {
    const data = {
      money,
      ammo: Object.assign({}, ammo),
      owned: Object.assign({}, owned),
      playerPos: { x: player.pos.x, z: player.pos.z },
      ts: Date.now()
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e){ console.warn('save failed', e); }
}
function loadSaveData(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e){ return null; }
}
function applySaveData(data){
  if (!data) return;
  money = typeof data.money === 'number' ? data.money : 0;
  if (data.ammo) Object.keys(ammo).forEach(k => { if (typeof data.ammo[k] === 'number') ammo[k] = data.ammo[k]; });
  if (data.owned) Object.keys(owned).forEach(k => { owned[k] = !!data.owned[k]; });
  if (data.playerPos){
    player.pos.x = data.playerPos.x;
    player.pos.z = data.playerPos.z;
  }
  updateMoneyUI();
  updateAmmoUI();
}

let autosaveTimer = 0;
function updateAutosave(dt){
  autosaveTimer += dt;
  if (autosaveTimer > 8){
    autosaveTimer = 0;
    saveGame();
  }
}

function startGame(){
  setMessage('コンビニ/銀行で強盗、赤い看板の銃屋で武器と弾薬を購入！', 3400);
  animate();
}

(function autoStart(){
  const existing = loadSaveData();
  if (existing) applySaveData(existing);
  startGame();
})();

})();
</script>
