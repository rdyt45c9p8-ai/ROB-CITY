<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CITY RAMPAGE</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0a0a0d;
    font-family: 'Arial Narrow', Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    z-index: 10;
  }

  /* Top HUD */
  #topBar {
    position: absolute; top: env(safe-area-inset-top, 10px); left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px;
  }
  #wantedBox {
    display: flex; gap: 2px; background: rgba(0,0,0,0.45);
    padding: 6px 9px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .star { font-size: 13px; color: #333; text-shadow: 0 0 4px #000; transition: color 0.2s, transform 0.2s; }
  .star.on { color: #ffd23f; text-shadow: 0 0 8px #ff9d00; transform: scale(1.1); }
  .star.on.hot { color: #ff3b3b; text-shadow: 0 0 10px #ff0000; }

  #statsPanel { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
  #healthBarWrap {
    width: 110px; height: 10px; border-radius: 6px; overflow: hidden;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.25);
  }
  #healthBarFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #ff4d4d, #ffd23f);
    transition: width 0.2s;
  }
  #hitFlash {
    position: fixed; inset: 0; pointer-events: none; z-index: 15;
    background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(180,0,0,0.55) 100%);
    opacity: 0; transition: opacity 0.15s;
  }
  #hitFlash.show { opacity: 1; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(4,4,8,0.4) 100%);
  }
  #camBtn {
    width: 60px; height: 60px; font-size: 11px; letter-spacing: 0.5px;
    background: radial-gradient(circle at 35% 30%, #4dd0e1, #0f6f7d);
  }
  #camBtn.active { background: radial-gradient(circle at 35% 30%, #ffd23f, #b3821a); }
  #camBtn:active { transform: scale(0.92); }
  #viewBtn {
    width: 56px; height: 56px; font-size: 11px; letter-spacing: 0.5px;
    background: radial-gradient(circle at 35% 30%, #7ea6ff, #2c4fa0);
  }
  #viewBtn:active { transform: scale(0.92); }
  #godBtn {
    width: 56px; height: 56px; font-size: 11px; letter-spacing: 0.5px;
    background: radial-gradient(circle at 35% 30%, #8a8f96, #3a3d42);
  }
  #godBtn.active { background: radial-gradient(circle at 35% 30%, #ffe27a, #d99a1a); box-shadow: 0 0 14px rgba(255,210,60,0.8); }
  #godBtn:active { transform: scale(0.92); }
  #creativeBadge {
    position: absolute; top: calc(env(safe-area-inset-top, 10px) + 40px); left: 50%;
    transform: translateX(-50%); color: #ffe27a; font-weight: 900; letter-spacing: 3px;
    font-size: 12px; text-shadow: 0 0 10px rgba(255,210,60,0.8), 0 2px 4px #000;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #creativeBadge.show { opacity: 1; }
  #speedo, #moneyBox, #ammoBox {
    background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 5px 12px; font-weight: bold;
    font-size: 13px; letter-spacing: 1px; min-width: 70px; text-align: right;
  }
  #speedo { color: #4de1ff; }
  #moneyBox { color: #7dff8a; }
  #ammoBox { color: #ffb347; opacity: 0; transition: opacity 0.2s; }
  #ammoBox.show { opacity: 1; }

  #robBar {
    position: absolute; left: 50%; bottom: 175px; transform: translateX(-50%);
    width: 220px; height: 14px; border-radius: 8px;
    background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3);
    opacity: 0; transition: opacity 0.2s; overflow: hidden;
  }
  #robBar.show { opacity: 1; }
  #robFill { height: 100%; width: 0%; background: linear-gradient(90deg,#ffd23f,#ff9d00); }
  #robLabel {
    position: absolute; left: 50%; bottom: 193px; transform: translateX(-50%);
    color: #ffd23f; font-size: 12px; letter-spacing: 2px; opacity: 0; transition: opacity 0.2s;
    text-shadow: 0 1px 3px #000;
  }
  #robLabel.show { opacity: 1; }

  #message {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 22px; font-weight: 900; letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(255,60,60,0.9), 0 2px 4px #000;
    opacity: 0; transition: opacity 0.3s; white-space: nowrap;
  }
  #message.show { opacity: 1; }

  #hint {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #eee; font-size: 15px; background: rgba(0,0,0,0.4);
    padding: 6px 14px; border-radius: 20px; opacity: 0; transition: opacity 0.2s;
    letter-spacing: 1px;
  }
  #hint.show { opacity: 1; }

  /* Joystick */
  #joyBase {
    position: absolute; left: 28px; bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
    pointer-events: auto;
  }
  #joyStick {
    position: absolute; left: 40px; top: 40px; width: 50px; height: 50px;
    border-radius: 50%; background: rgba(77,225,255,0.55);
    border: 2px solid rgba(255,255,255,0.6);
  }

  /* Action buttons */
  #actionZone {
    position: absolute; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    pointer-events: auto;
  }
  #minimapWrap {
    position: absolute; left: 16px; top: calc(env(safe-area-inset-top, 10px) + 60px);
    width: 130px; height: 130px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35); overflow: hidden;
    background: rgba(10,12,16,0.75); box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
  #minimapCanvas { width: 100%; height: 100%; display: block; }
  #minimapLabel {
    position: absolute; left: 16px; top: calc(env(safe-area-inset-top, 10px) + 192px);
    color: #cfd8e0; font-size: 10px; letter-spacing: 1px; text-align: center; width: 130px;
    text-shadow: 0 1px 3px #000;
  }
  .btn {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #fff; border: 2px solid rgba(255,255,255,0.5);
    text-shadow: 0 1px 2px #000; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }
  #punchBtn {
    width: 90px; height: 90px; font-size: 16px; letter-spacing: 1px;
    background: radial-gradient(circle at 35% 30%, #ff6b5b, #c62828);
  }
  #punchBtn:active { transform: scale(0.92); }
  #enterBtn {
    width: 66px; height: 66px; font-size: 11px; letter-spacing: 0.5px;
    background: radial-gradient(circle at 35% 30%, #5bd6ff, #0d7fb0);
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #enterBtn.show { opacity: 1; pointer-events: auto; }
  #enterBtn:active { transform: scale(0.92); }
  #weaponBtn {
    width: 60px; height: 60px; font-size: 11px; letter-spacing: 0.5px;
    background: radial-gradient(circle at 35% 30%, #b98cff, #5a2fa3);
  }
  #weaponBtn:active { transform: scale(0.92); }

  #busted {
    position: fixed; inset: 0; background: rgba(120,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 20;
  }
  #busted.show { opacity: 1; }
  #busted span {
    font-size: 54px; font-weight: 900; color: #fff; letter-spacing: 6px;
    text-shadow: 0 0 20px #ff2b2b, 0 4px 6px #000;
  }

  #loading {
    position: fixed; inset: 0; background: #0a0a0d; color: #4de1ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; letter-spacing: 3px; z-index: 100;
  }

  #shopOverlay {
    position: fixed; inset: 0; background: rgba(6,4,4,0.82);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 30;
  }
  #shopOverlay.show { opacity: 1; pointer-events: auto; }
  #shopPanel {
    width: min(420px, 88vw); max-height: 82vh; overflow-y: auto;
    background: linear-gradient(160deg, #1c1210, #120c0b);
    border: 2px solid #6b3a1e; border-radius: 14px;
    padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  #shopPanel h2 {
    color: #ffb347; text-align: center; margin: 0 0 4px; letter-spacing: 3px;
    font-size: 20px; text-shadow: 0 0 8px rgba(255,140,20,0.5);
  }
  #shopMoneyLine { text-align: center; color: #7dff8a; font-size: 14px; margin-bottom: 12px; font-weight: bold; }
  .shopRow {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 10px;
  }
  .shopRowTitle { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .shopRowTitle span:first-child { color: #fff; font-weight: bold; letter-spacing: 1px; font-size: 15px; }
  .shopRowTitle span:last-child { color: #ffd23f; font-size: 13px; }
  .shopBtnRow { display: flex; gap: 8px; }
  .shopBtn {
    flex: 1; text-align: center; padding: 9px 6px; border-radius: 8px;
    font-size: 13px; font-weight: bold; letter-spacing: 0.5px; color: #fff;
    background: linear-gradient(160deg, #3a6bd9, #1c3f8f); border: 1px solid rgba(255,255,255,0.25);
  }
  .shopBtn.ammo { background: linear-gradient(160deg, #d97a3a, #8f4a1c); }
  .shopBtn.disabled { background: #2a2a2a; color: #777; }
  #shopCloseBtn {
    display: block; margin: 14px auto 0; padding: 9px 26px; border-radius: 20px;
    background: rgba(255,255,255,0.1); color: #eee; border: 1px solid rgba(255,255,255,0.25);
    font-weight: bold; letter-spacing: 1px; text-align: center;
  }

  #adminOverlay {
    position: fixed; inset: 0; background: rgba(6,4,4,0.82);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 40;
  }
  #adminOverlay.show { opacity: 1; pointer-events: auto; }
  #adminPanel {
    width: min(300px, 84vw); background: linear-gradient(160deg, #1c1210, #120c0b);
    border: 2px solid #6b3a1e; border-radius: 14px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center;
  }
  #adminPanel h2 { color: #ffb347; margin: 0 0 6px; letter-spacing: 3px; font-size: 18px; }
  #adminSub { color: #cfc8c0; font-size: 12px; margin-bottom: 14px; }
  #adminInput {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px;
    letter-spacing: 3px; text-align: center; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08); color: #fff; text-transform: uppercase;
  }
  #adminError {
    color: #ff6b6b; font-size: 12px; margin-top: 8px; height: 14px; opacity: 0; transition: opacity 0.2s;
  }
  #adminError.show { opacity: 1; }
  .adminBtnRow { display: flex; gap: 10px; margin-top: 14px; }
  .adminBtn {
    flex: 1; text-align: center; padding: 10px 0; border-radius: 8px;
    font-weight: bold; letter-spacing: 1px; font-size: 13px; color: #eee;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
  }
  .adminBtn.primary { background: linear-gradient(160deg, #d9583a, #8f2a1c); }
</style>
</head>
<body>

<div id="loading">LOADING CITY...</div>

<canvas id="gameCanvas"></canvas>

<div id="vignette"></div>
<div id="hitFlash"></div>

<div id="hud">
  <div id="minimapWrap"><canvas id="minimapCanvas" width="130" height="130"></canvas></div>
  <div id="minimapLabel">現在地</div>
  <div id="topBar">
    <div id="wantedBox">
      <span class="star" id="s1">★</span>
      <span class="star" id="s2">★</span>
      <span class="star" id="s3">★</span>
      <span class="star" id="s4">★</span>
      <span class="star" id="s5">★</span>
      <span class="star" id="s6">★</span>
      <span class="star" id="s7">★</span>
      <span class="star" id="s8">★</span>
      <span class="star" id="s9">★</span>
      <span class="star" id="s10">★</span>
    </div>
    <div id="statsPanel">
      <div id="healthBarWrap"><div id="healthBarFill"></div></div>
      <div id="speedo"><span id="speedVal">0</span> km/h</div>
      <div id="moneyBox">$<span id="moneyVal">0</span></div>
      <div id="ammoBox">弾: <span id="ammoVal">0</span></div>
    </div>
  </div>
  <div id="message"></div>
  <div id="hint"></div>
  <div id="robLabel">ROBBING...</div>
  <div id="robBar"><div id="robFill"></div></div>

  <div id="joyBase"><div id="joyStick"></div></div>
  <div id="actionZone">
    <div class="btn" id="viewBtn">3RD</div>
    <div class="btn" id="godBtn">GOD</div>
    <div class="btn" id="camBtn">CAM</div>
    <div class="btn" id="weaponBtn">FIST</div>
    <div class="btn" id="enterBtn">ENTER</div>
    <div class="btn" id="punchBtn">PUNCH</div>
  </div>
</div>
<div id="creativeBadge">CREATIVE MODE</div>

<div id="adminOverlay">
  <div id="adminPanel">
    <h2>管理者コード</h2>
    <input type="text" id="adminInput" placeholder="コードを入力" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="adminError">コードが違います</div>
    <div class="shopBtnRow">
      <div class="shopBtn" id="adminSubmit">決定</div>
      <div class="shopBtn disabled" id="adminCancel">キャンセル</div>
    </div>
  </div>
</div>

<div id="busted"><span id="bustedText">BUSTED!</span></div>

<div id="shopOverlay">
  <div id="shopPanel">
    <h2>GUN SHOP</h2>
    <div id="shopMoneyLine">所持金 $0</div>
    <div id="shopList"></div>
    <div id="shopCloseBtn">閉じる</div>
  </div>
</div>

<div id="adminOverlay">
  <div id="adminPanel">
    <h2>ADMIN ACCESS</h2>
    <div id="adminSub">管理者コードを入力してください</div>
    <input type="text" id="adminInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="CODE">
    <div id="adminError">コードが違います</div>
    <div class="adminBtnRow">
      <div class="adminBtn" id="adminCancelBtn">キャンセル</div>
      <div class="adminBtn primary" id="adminSubmitBtn">送信</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

// ---------------------------------------------------------------------------
// SETUP
// ---------------------------------------------------------------------------
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const maxAniso = renderer.capabilities.getMaxAnisotropy(); // sharper ground textures at grazing angles, no extra draw calls
function resize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8fa8c2, 90, 340);

function makeSkyTexture(){
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#0e2a52');
  grad.addColorStop(0.45, '#3f6fa0');
  grad.addColorStop(0.75, '#a7c2d6');
  grad.addColorStop(1, '#e8d9bd');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,2,256);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.LinearFilter;
  return tex;
}
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 24, 16),
  new THREE.MeshBasicMaterial({ map: makeSkyTexture(), side: THREE.BackSide, fog: false })
);
scene.add(sky);

const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(9, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xfff4d6, fog: false })
);
sunDisc.position.set(140, 120, 60);
scene.add(sunDisc);

// drifting cloud sprites: cheap atmosphere (sprites are camera-facing, no extra geometry/shadow cost)
function makeCloudTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(64,64,4,64,64,62);
  grad.addColorStop(0, 'rgba(255,255,255,0.85)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.4)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const cloudTex = makeCloudTexture();
const clouds = []; // {sprite, speed}
for (let i=0;i<22;i++){
  const mat = new THREE.SpriteMaterial({ map: cloudTex, transparent: true, opacity: 0.55, depthWrite: false, fog: false });
  const sprite = new THREE.Sprite(mat);
  const s = 40 + Math.random()*50;
  sprite.scale.set(s, s*0.55, 1);
  const ang = Math.random()*Math.PI*2, r = 80 + Math.random()*420;
  sprite.position.set(Math.cos(ang)*r, 90 + Math.random()*60, Math.sin(ang)*r);
  scene.add(sprite);
  clouds.push({ sprite, speed: 0.6 + Math.random()*0.8 });
}
function updateClouds(dt){
  clouds.forEach(c => { c.sprite.position.x += c.speed * dt; if (c.sprite.position.x > 650) c.sprite.position.x = -650; });
}

const camera = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.4, 650);
camera.position.set(0, 8, 14);

window.addEventListener('resize', resize);

// Lighting
const hemi = new THREE.HemisphereLight(0x9fc4ff, 0x2a2013, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d6, 1.35);
sun.position.set(60, 90, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(1536, 1536);
sun.shadow.camera.left = -48; sun.shadow.camera.right = 48;
sun.shadow.camera.top = 48; sun.shadow.camera.bottom = -48;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 170;
sun.shadow.bias = -0.0018;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const sunTarget = new THREE.Object3D();
scene.add(sunTarget);
sun.target = sunTarget;
const fill = new THREE.DirectionalLight(0x4466ff, 0.22);
fill.position.set(-40, 30, -40);
scene.add(fill);

function updateSunFollow(){
  sun.position.set(player.pos.x + 55, 90, player.pos.z + 35);
  sunTarget.position.set(player.pos.x, 0, player.pos.z);
}

// ---------------------------------------------------------------------------
// GROUND (road grid texture)
// ---------------------------------------------------------------------------
const MAP_SIZE = 6800; // 10x the previous map size
const CELL = 20;
const CITY_HALF = 160; // city (buildings/roads) spans -160..160 (must be a multiple of CELL*2 to keep the road grid and building grid aligned)

function makeRoadTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2c2d32';
  ctx.fillRect(0,0,256,256);
  // asphalt grain
  for (let i=0;i<1400;i++){
    ctx.fillStyle = `rgba(${Math.random()<0.5?'0,0,0':'255,255,255'},${0.02+Math.random()*0.05})`;
    ctx.fillRect(Math.random()*256, Math.random()*256, 1.4, 1.4);
  }
  ctx.fillStyle = '#3a3b41';
  ctx.fillRect(0, 92, 256, 72);
  ctx.fillRect(92, 0, 72, 256);
  // curb edges
  ctx.fillStyle = '#57585e';
  ctx.fillRect(0, 90, 256, 3);
  ctx.fillRect(0, 163, 256, 3);
  ctx.fillRect(90, 0, 3, 256);
  ctx.fillRect(163, 0, 3, 256);
  // dashed lane lines
  ctx.strokeStyle = '#e0cf74';
  ctx.lineWidth = 3;
  ctx.setLineDash([16,16]);
  ctx.beginPath(); ctx.moveTo(0,128); ctx.lineTo(256,128); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(128,0); ctx.lineTo(128,256); ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set((CITY_HALF*2)/CELL, (CITY_HALF*2)/CELL);
  tex.anisotropy = maxAniso;
  return tex;
}
function makeGrassTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3d5a34';
  ctx.fillRect(0,0,128,128);
  for (let i=0;i<900;i++){
    const shade = Math.random();
    ctx.fillStyle = shade < 0.5 ? 'rgba(70,100,55,0.35)' : 'rgba(30,45,25,0.3)';
    ctx.fillRect(Math.random()*128, Math.random()*128, 2, 2);
  }
  for (let i=0;i<20;i++){
    ctx.fillStyle = 'rgba(120,100,70,0.18)';

function makeWindowTexture(baseColor, litRatio){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = baseColor;
  ctx.fillRect(0,0,64,128);
  const cols = 5, rows = 10;
  const cw = 64/cols, rh = 128/rows;
  for (let r=0;r<rows;r++){
    for (let cIdx=0;cIdx<cols;cIdx++){
      const lit = Math.random() < litRatio;
      ctx.fillStyle = lit ? 'rgba(255,214,140,0.9)' : 'rgba(10,14,20,0.55)';
      ctx.fillRect(cIdx*cw+cw*0.18, r*rh+rh*0.22, cw*0.64, rh*0.56);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  return tex;
}
const windowBaseColors = ['#2f3947','#3a2f2b','#332b3a','#2b3a30','#3a3025'];

// reserved city-block coordinates for special plots (stores/banks/gun shops) so the
// regular procedural building generator never buries them under a normal building
const RESERVED_PLOTS = [
  [0,-20],[-20,0],[20,20],[-20,-20],[40,20],[-20,20],[40,-20],[-40,-40],[20,60],[-20,40], // stores
  [0,60],[60,0],[-60,-20],[0,-60], // banks
  [-40,0],[60,40],[20,-60],[80,-60],[-60,40], // gun shops
  [80,80],[100,80],[120,80],[80,100],[100,100],[120,100],[80,120],[100,120],[120,120], // museum footprint
  [-80,-80],[-60,-80],[-80,-60],[-60,-60] // police station footprint
];
function isReservedPlot(cx, cz){
  return RESERVED_PLOTS.some(p => Math.abs(p[0]-cx) < CELL*0.75 && Math.abs(p[1]-cz) < CELL*0.75);
}

const cellsAcross = Math.floor((CITY_HALF*2) / CELL);
for (let gx = -cellsAcross/2; gx < cellsAcross/2; gx++){
  for (let gz = -cellsAcross/2; gz < cellsAcross/2; gz++){
    const cx = gx*CELL, cz = gz*CELL;
    if (Math.hypot(cx, cz) < 22) continue; // keep spawn area clear
    if (isReservedPlot(cx, cz)) continue; // keep special-plot blocks clear
    if (Math.random() < 0.18) continue; // occasional empty lot
    const hx = 3.2 + Math.random()*3.5;
    const hz = 3.2 + Math.random()*3.5;

    const sideMat = new THREE.MeshStandardMaterial({ map: winTex, roughness: 0.75, metalness: 0.15 });

}

(function buildInstancedScenery(){
  const dummy = new THREE.Object3D();

  const trunkMesh = new THREE.InstancedMesh(treeTrunkGeo, treeTrunkMat, treeSpecs.length);
  trunkMesh.castShadow = true;
  treeSpecs.forEach((t, i) => {
    dummy.position.set(t.x, 1.3*t.scale, t.z);
    dummy.rotation.set(0, t.rotY, 0);
    dummy.scale.set(t.scale, t.scale, t.scale);
    dummy.updateMatrix();
    trunkMesh.setMatrixAt(i, dummy.matrix);
  });
  trunkMesh.instanceMatrix.needsUpdate = true;
  scene.add(trunkMesh);

  for (let colorIdx=0; colorIdx<TREE_FOLIAGE_COLORS.length; colorIdx++){
    const group = treeSpecs.filter(t => t.colorIdx === colorIdx);
    if (!group.length) continue;
    for (let tier=0; tier<3; tier++){
      const foliageMesh = new THREE.InstancedMesh(treeFoliageGeos[tier], treeFoliageMats[colorIdx], group.length);
      foliageMesh.castShadow = true;
      group.forEach((t, i) => {
        dummy.position.set(t.x, (2.6 + tier*1.5)*t.scale, t.z);
        dummy.rotation.set(0, t.rotY, 0);
        dummy.scale.set(t.scale, t.scale, t.scale);
        dummy.updateMatrix();
        foliageMesh.setMatrixAt(i, dummy.matrix);
      });
      foliageMesh.instanceMatrix.needsUpdate = true;
      scene.add(foliageMesh);
    }
  }

  if (rockSpecs.length){
    const rockMesh = new THREE.InstancedMesh(rockGeo, rockMat, rockSpecs.length);
    rockSpecs.forEach((r, i) => {
      dummy.position.set(r.x, 0.35, r.z);
      dummy.rotation.set(r.rx, r.ry, r.rz);
      dummy.scale.set(r.scale, r.scale, r.scale);
      dummy.updateMatrix();
      rockMesh.setMatrixAt(i, dummy.matrix);
    });
    rockMesh.instanceMatrix.needsUpdate = true;
    scene.add(rockMesh); // no shadow casting on ground clutter - cheap perf win, unnoticeable visually
  }

  if (mountainSpecs.length){
    const baseMesh = new THREE.InstancedMesh(mountainBaseGeo, mountainBaseMat, mountainSpecs.length);
    baseMesh.castShadow = true;
    baseMesh.receiveShadow = true;
    const snowMesh = new THREE.InstancedMesh(mountainSnowGeo, mountainSnowMat, mountainSpecs.length);
    snowMesh.castShadow = true;
    mountainSpecs.forEach((m, i) => {
      dummy.position.set(m.x, m.height/2, m.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(m.radius, m.height, m.radius);
      dummy.updateMatrix();
      baseMesh.setMatrixAt(i, dummy.matrix);
      dummy.position.set(m.x, m.height*0.86, m.z);
      dummy.scale.set(m.radius*0.36, m.height*0.32, m.radius*0.36);
      dummy.updateMatrix();
      snowMesh.setMatrixAt(i, dummy.matrix);
    });
    baseMesh.instanceMatrix.needsUpdate = true;
    snowMesh.instanceMatrix.needsUpdate = true;
    scene.add(baseMesh);
    scene.add(snowMesh);
  }
})();

function makeRuralRoadTexture(){
  const c = document.createElement('canvas');
  c.width = 32; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4a4640';
  ctx.fillRect(0,0,32,256);
  for (let i=0;i<300;i++){
    ctx.fillStyle = `rgba(0,0,0,${0.03+Math.random()*0.05})`;
    ctx.fillRect(Math.random()*32, Math.random()*256, 1.2, 1.2);
  }
  ctx.strokeStyle = '#e0cf74';
  ctx.lineWidth = 2;
  ctx.setLineDash([14,14]);
  ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(16,256); ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAniso;
  return tex;
}
const ruralRoadTexture = makeRuralRoadTexture();

function buildCurvedRoad(points, width){
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], 0.03, p[1])));
  const segs = Math.max(20, points.length * 24);
  const curvePts = curve.getPoints(segs);
  const positions = [];
  const uvs = [];
  const indices = [];
  for (let i=0;i<curvePts.length;i++){
    const t = i/(curvePts.length-1);
    const tangent = curve.getTangentAt(Math.min(0.999, Math.max(0.001, t)));
    const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    const p = curvePts[i];
    const left = p.clone().addScaledVector(normal, width/2);
    const right = p.clone().addScaledVector(normal, -width/2);
    positions.push(left.x, left.y, left.z, right.x, right.y, right.z);
    const v = i * 0.5;
    uvs.push(0, v, 1, v);
  }
  for (let i=0;i<curvePts.length-1;i++){
    const a = i*2, b = i*2+1, c = i*2+2, d = i*2+3;
    indices.push(a,b,c, b,d,c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();

    const altitude = 55 + Math.sin(p.phase)*45;
    const heading = p.phase + Math.PI/2;
    p.mesh.position.set(x, Math.max(20, altitude), z);

  const pitchInput = input.throttle;
  playerPlane.pitch += (pitchInput*0.5 - playerPlane.pitch) * Math.min(1, dt*3);

  playerPlane.pos.x = Math.max(-MAP_HALF, Math.min(MAP_HALF, playerPlane.pos.x + dx));

    const dist = Math.hypot(dx,dz);

    const dot = (dx/dist)*fwd.x + (dz/dist)*fwd.z;

const AIRBUS_YAW_OFFSET = 0; // tweak by Math.PI if the model ends up facing backwards
function applyAirbusModel(template, targetGroup, opts){
  opts = opts || {};
  const clone = template.clone(true);
  clone.rotation.y = AIRBUS_YAW_OFFSET;
  targetGroup.traverse(o => { if (o.isMesh) o.visible = false; });
  targetGroup.add(clone);
  if (opts.tint){
    clone.traverse(o => {
      if (o.isMesh && o.material){
        o.material = o.material.clone();
        if (o.material.color) o.material.color.multiplyScalar(1); // keep original livery
      }
    });
  }
}
function loadAirplaneModel(){
  if (typeof THREE.GLTFLoader === 'undefined' || typeof AIRBUS_MODEL_B64 === 'undefined') return;
  const loader = new THREE.GLTFLoader();
  let buffer;
  try {
    buffer = base64ToArrayBuffer(AIRBUS_MODEL_B64);
  } catch (e){
    console.warn('Airbus model decode failed', e);
    return;
  }
  loader.parse(buffer, '', (gltf) => {
    const raw = gltf.scene;
    const box = new THREE.Box3().setFromObject(raw);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const targetLength = 17; // matches the scale of the procedural plane it replaces
    const scale = targetLength / maxDim;
    raw.scale.setScalar(scale);
    const box2 = new THREE.Box3().setFromObject(raw);
    raw.position.y -= box2.min.y; // rest the belly/gear on y=0 within its parent group
    const center = new THREE.Vector3();
    box2.getCenter(center);
    raw.position.x -= center.x;
    raw.position.z -= center.z;
    raw.traverse(o => {
      if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; }
    });

    // swap it onto every existing plane instance (parked, ambient sky traffic, player's)
    decorativePlaneMeshes.forEach(g => applyAirbusModel(raw, g));
    skyPlanes.forEach(p => applyAirbusModel(raw, p.mesh));
    applyAirbusModel(raw, playerPlane.mesh);

    setMessage('飛行機モデルを適用しました', 1600);
  }, (err) => {
    console.warn('Airbus model failed to load, using default plane look', err);
  });
}
setTimeout(loadAirplaneModel, 1200); // deferred and staggered after the player model so we don't block the main thread for too long at once

function collideAndMove(pos, dx, dz, radius){
  const tryPos = {x: pos.x + dx, z: pos.z + dz};
  // test full move
  if (!hitsBuilding(tryPos.x, tryPos.z, radius)){
    pos.x = tryPos.x; pos.z = tryPos.z;
  } else {
    // slide along axes
    if (!hitsBuilding(pos.x+dx, pos.z, radius)) pos.x += dx;
    else if (!hitsBuilding(pos.x, pos.z+dz, radius)) pos.z += dz;
  }
  pos.x = Math.max(-MAP_HALF, Math.min(MAP_HALF, pos.x));
  pos.z = Math.max(-MAP_HALF, Math.min(MAP_HALF, pos.z));
}
function hitsBuilding(x, z, radius){
  for (let i=0;i<buildings.length;i++){
    const b = buildings[i];
    if (Math.abs(x-b.x) < b.hx+radius && Math.abs(z-b.z) < b.hz+radius) return true;
  }
  return false;
}

function makeDecalTexture(label, accent){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.clearRect(0,0,512,128);
  // badge/star
  ctx.save();
  ctx.translate(64, 64);
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  for (let i=0;i<8;i++){
    const a = (Math.PI/4)*i;
    const r = i % 2 === 0 ? 42 : 22;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = accent;
  ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // text
  ctx.font = 'bold 54px Arial Narrow, Arial';
  ctx.fillStyle = accent;
  ctx.textBaseline = 'middle';
  ctx.fillText(label, 128, 68);
  ctx.font = 'bold 54px Arial Narrow, Arial';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.strokeText(label, 128, 68);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}

  const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.75, 4.2),
    new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.28, metalness: 0.55, envMapIntensity: 1 }));
  body.position.y = 0.75;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.6, 2.0),
    new THREE.MeshStandardMaterial({ color: 0x1a1c22, roughness: 0.35, metalness: 0.4 }));
  cabin.position.set(0, 1.32, -0.1);
  cabin.castShadow = true;
  g.add(cabin);
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd3ff, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.55 });
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.5, 0.08), glassMat);
  windshield.position.set(0, 1.32, 0.88);
  windshield.rotation.x = -0.28;
  g.add(windshield);
  const rearGlass = new THREE.Mesh(new THREE.BoxGeometry(1.62, 0.46, 0.08), glassMat);
  rearGlass.position.set(0, 1.3, -1.08);
  rearGlass.rotation.x = 0.32;
  g.add(rearGlass);
  // side windows
  [-1, 1].forEach(side => {
    const sideGlass = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.42, 1.7), glassMat);
    sideGlass.position.set(side*0.86, 1.34, -0.1);
    g.add(sideGlass);
    // side mirror
    const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.26),
      new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.4 }));
    mirror.position.set(side*1.12, 1.05, 1.0);
    mirror.castShadow = true;
    g.add(mirror);
  });
  const bumperMat = new THREE.MeshStandardMaterial({ color: 0x16171b, roughness: 0.5 });
  const fBumper = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.3, 0.3), bumperMat);
  fBumper.position.set(0, 0.42, 2.1);
  g.add(fBumper);
  const rBumper = fBumper.clone();
  rBumper.position.set(0, 0.42, -2.1);
  g.add(rBumper);
  const headlightMat = new THREE.MeshStandardMaterial({ color: 0xfff8e0, emissive: 0xfff2b0, emissiveIntensity: 1.4 });
  [-0.72, 0.72].forEach(xoff => {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.2, 0.1), headlightMat);
    hl.position.set(xoff, 0.72, 2.12);
    g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.2, 0.1),
      new THREE.MeshStandardMaterial({ color: 0xff3b3b, emissive: 0xff1010, emissiveIntensity: 1.2 }));
    tl.position.set(xoff, 0.72, -2.12);
    g.add(tl);
  });
  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.32, 18);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.85 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 0.8, roughness: 0.3 });
  const wheelPos = [[-1.05,0.42,1.35],[1.05,0.42,1.35],[-1.05,0.42,-1.35],[1.05,0.42,-1.35]];
  wheelPos.forEach(p => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(p[0], p[1], p[2]);
    w.castShadow = true;
    g.add(w);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.34, 10), rimMat);
    rim.rotation.z = Math.PI/2;
    rim.position.set(p[0] + (p[0]>0?0.01:-0.01), p[1], p[2]);
    g.add(rim);
  });
  if (isPolice){
    const accent = label === 'SWAT' ? '#ffffff' : '#0a3d91';
    const bar = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.22, 0.5),
      new THREE.MeshStandardMaterial({ color: 0x222222 }));
    bar.position.set(0, 1.72, -0.1);
    g.add(bar);
    const red = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.18,0.42), new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0xff0000, emissiveIntensity: 1 }));
    red.position.set(-0.28, 1.72, -0.1);
    const blue = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.18,0.42), new THREE.MeshStandardMaterial({ color: 0x2255ff, emissive: 0x0033ff, emissiveIntensity: 1 }));
    blue.position.set(0.28, 1.72, -0.1);
    g.add(red); g.add(blue);
    g.userData.siren = { red, blue, t: 0 };

    // A-pillar spotlight
    const spot = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.22, 8),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.6, roughness: 0.3 }));
    spot.rotation.z = Math.PI/2;
    spot.position.set(0.84, 1.36, 0.7);
    g.add(spot);

    // trunk antenna
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.9, 6),
      new THREE.MeshStandardMaterial({ color: 0x111111 }));
    antenna.position.set(-0.5, 1.55, -1.8);
    g.add(antenna);

    // front push bar
    const barMat = new THREE.MeshStandardMaterial({ color: 0x141414, metalness: 0.5, roughness: 0.4 });
    const pushFrame = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.28, 0.08), barMat);
    pushFrame.position.set(0, 0.62, 2.28);
    g.add(pushFrame);
    [-0.85, -0.28, 0.28, 0.85].forEach(xoff => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.42, 6), barMat);
      post.position.set(xoff, 0.5, 2.24);
      g.add(post);
    });

    // door decals
    if (label){
      const tex = makeDecalTexture(label, accent);
      [-1, 1].forEach(side => {
        const decal = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.42),
          new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide }));
        decal.position.set(side*1.061, 0.82, -0.05);
        decal.rotation.y = Math.PI/2;
        g.add(decal);
      });
    }
  }
  return g;
}

    const w = new THREE.Mesh(wheelGeo, new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.85 }));
    w.rotation.z = Math.PI/2;

    rim.rotation.z = Math.PI/2;
    rim.position.set(p[0] + (p[0]>0?0.01:-0.01), p[1], p[2]);

  });

const CIVILIAN_VEHICLE_COLORS = [0xd94f3d, 0xf2c14e, 0x4fa8d9, 0x8a5fd9, 0xe0e0e0, 0x3a3a3a, 0x5fbf7a];
const SUPERCAR_COLORS = [0xf2c31a, 0xff3b1a, 0x1a8fe0, 0x1a1a1a];
function makeRandomVehicle(colorOverride){
  const roll = Math.random();
  const color = colorOverride !== undefined ? colorOverride
    : CIVILIAN_VEHICLE_COLORS[(Math.random()*CIVILIAN_VEHICLE_COLORS.length)|0];
  if (roll < 0.10) return { mesh: makeMotorcycle(color), isBike: true };
  if (roll < 0.24) return { mesh: makeTruck(color), isBike: false };
  if (roll < 0.36) return { mesh: makeSportsCar(color), isBike: false };
  if (roll < 0.45) return { mesh: makeSupercar(SUPERCAR_COLORS[(Math.random()*SUPERCAR_COLORS.length)|0]), isBike: false };
  return { mesh: makeCar(color, false), isBike: false };
}

  windshield.position.set(0, 1.55, 1.32);

function animateWalk(entity, dt, refSpeed){
  if (!entity.armL || !entity.armR) return;
  entity.walkPhase = (entity.walkPhase || 0) + dt * Math.min(Math.abs(entity.speed), refSpeed) * 3.4;
  const amp = Math.min(1, Math.abs(entity.speed) / refSpeed) * 0.6;
  entity.armL.rotation.x = Math.sin(entity.walkPhase) * amp;
  entity.armR.rotation.x = -Math.sin(entity.walkPhase) * amp;
  if (entity.legL && entity.legR){
    const legAmp = amp * 0.9;
    entity.legL.rotation.x = -Math.sin(entity.walkPhase) * legAmp;
    entity.legR.rotation.x = Math.sin(entity.walkPhase) * legAmp;
  }
}

let playerMixer = null;
let playerActions = null;
let playerCurrentAction = null;

function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

function loadPlayerModel(){
  if (typeof THREE.GLTFLoader === 'undefined' || typeof SPIDERMAN_MODEL_B64 === 'undefined') return;
  const loader = new THREE.GLTFLoader();
  let buffer;
  try {
    buffer = base64ToArrayBuffer(SPIDERMAN_MODEL_B64);
  } catch (e){
    console.warn('Spider-Man model decode failed', e);
    return;
  }
  loader.parse(buffer, '', (gltf) => {
    const model = gltf.scene;
    // scale to a consistent character height and place feet at y=0
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const targetHeight = 1.85;
    const scale = size.y > 0.001 ? targetHeight / size.y : 1;
    model.scale.setScalar(scale);
    const box2 = new THREE.Box3().setFromObject(model);
    model.position.y -= box2.min.y;
    model.traverse(o => {
      if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; }
    });
    // hide the procedural body so only the loaded model shows (keep the
    // group hierarchy intact so existing arm/leg/weapon animation code
    // doesn't break, it just has nothing visible to animate anymore)
    player.mesh.traverse(o => { if (o.isMesh) o.visible = false; });
    model.name = 'spidermanModel';
    player.mesh.add(model);

    if (gltf.animations && gltf.animations.length){
      playerMixer = new THREE.AnimationMixer(model);
      const clips = gltf.animations;
      const findClip = (keywords) => clips.find(c => keywords.some(k => c.name.toLowerCase().includes(k)));
      const walkClip = findClip(['walk','run','jog']) || clips[0];
      const idleClip = findClip(['idle','stand']) || clips[0];
      playerActions = {
        walk: playerMixer.clipAction(walkClip),
        idle: playerMixer.clipAction(idleClip)
      };
      playerActions.idle.play();
      playerCurrentAction = 'idle';
    }
    setMessage('スパイダーマン装備完了！', 1600);
  }, (err) => {
    console.warn('Spider-Man model failed to load, using default look', err);
  });
}
setTimeout(loadPlayerModel, 30); // deferred so the loading screen doesn't hang while this large model decodes

function updatePlayerModelAnimation(dt){
  if (!playerMixer) return;
  playerMixer.update(dt);
  const moving = mode === 'foot' && Math.abs(player.speed) > 0.3;
  const desired = moving ? 'walk' : 'idle';
  if (desired !== playerCurrentAction && playerActions[desired]){
    const from = playerActions[playerCurrentAction];
    const to = playerActions[desired];
    to.reset().play();
    if (from) from.crossFadeTo(to, 0.25, false);
    playerCurrentAction = desired;
  }
}

(function buildTrafficLights(){

function updateTrafficLights(dt){
  trafficLightTimer += dt;
  if (trafficLightTimer > 6){
    trafficLightTimer = 0;
    trafficLightPhase = trafficLightPhase === 'X_GREEN' ? 'Z_GREEN' : 'X_GREEN';
  }
  const xGreen = trafficLightPhase === 'X_GREEN';
  trafficLightMeshes.forEach(tl => {
    tl.red.material.emissiveIntensity = xGreen ? 0.15 : 1.5;
    tl.green.material.emissiveIntensity = xGreen ? 1.5 : 0.15;
  });
}

function nextIntersectionAhead(coord, dir){
  const spacing = CELL, offset = CELL/2;
  let k = Math.floor((coord - offset) / spacing);
  let next = k*spacing + offset;
  if (dir > 0){ while (next <= coord + 0.01) next += spacing; }
  else { while (next >= coord - 0.01) next -= spacing; }
  return next;
}
const SIGNAL_STOP_LOOKAHEAD = 6.5;
const SIGNAL_STOP_LINE = 1.6;
function applySignalSpeed(car, dt){
  const coord = car.axis === 'x' ? car.pos.x : car.pos.z;
  const distToInt = Math.abs(nextIntersectionAhead(coord, car.dir) - coord);
  const allowed = car.axis === 'x' ? trafficLightPhase === 'X_GREEN' : trafficLightPhase === 'Z_GREEN';
  const mustSlow = !allowed && distToInt < 4.5 && distToInt > 1.2;
  const target = mustSlow ? car.baseSpeed * 0.2 : car.baseSpeed; // slow way down, but never fully freeze
  car.speed += (target - car.speed) * Math.min(1, dt*3);
}

function applyMrapModel(mesh){
  if (!mrapTemplate || mesh.userData.mrapApplied) return;
  const clone = mrapTemplate.clone(true);
  mesh.traverse(o => { if (o.isMesh) o.visible = false; });
  mesh.add(clone);
  mesh.userData.mrapApplied = true;
}
function loadMrapModel(){
  if (typeof THREE.GLTFLoader === 'undefined' || typeof MRAP_MODEL_B64 === 'undefined') return;
  const loader = new THREE.GLTFLoader();
  let buffer;
  try { buffer = base64ToArrayBuffer(MRAP_MODEL_B64); }
  catch (e){ console.warn('MRAP model decode failed', e); return; }
  loader.parse(buffer, '', (gltf) => {
    const raw = gltf.scene;
    const box = new THREE.Box3().setFromObject(raw);
    const size = new THREE.Vector3();
    box.getSize(size);
    const targetLength = 5.6; // a bit bigger than the procedural sedan, matches an armored vehicle
    const maxDim = Math.max(size.x, size.z) || 1;
    const scale = targetLength / maxDim;
    raw.scale.setScalar(scale);
    const box2 = new THREE.Box3().setFromObject(raw);
    raw.position.y -= box2.min.y;
    const center = new THREE.Vector3();
    box2.getCenter(center);
    raw.position.x -= center.x;
    raw.position.z -= center.z;
    raw.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    mrapTemplate = raw;
    // retroactively apply to any SWAT vehicles already on the field
    swatVans.forEach(v => applyMrapModel(v.mesh));
    patrolVehicles.forEach(v => { if (v.kind === 'swat') applyMrapModel(v.mesh); });
    setMessage('SWAT装甲車を適用しました', 1500);
  }, (err) => { console.warn('MRAP model failed to load, using default look', err); });
}

let swatBodyTemplate = null;
function applySwatModel(mesh){
  if (!swatBodyTemplate || mesh.userData.swatModelApplied) return;
  const clone = swatBodyTemplate.clone(true);
  mesh.traverse(o => { if (o.isMesh) o.visible = false; });
  mesh.add(clone);
  mesh.userData.swatModelApplied = true;
}
function loadSwatModel(){
  if (typeof THREE.GLTFLoader === 'undefined' || typeof SWAT_MODEL_B64 === 'undefined') return;
  const loader = new THREE.GLTFLoader();
  let buffer;
  try { buffer = base64ToArrayBuffer(SWAT_MODEL_B64); }
  catch (e){ console.warn('SWAT model decode failed', e); return; }
  loader.parse(buffer, '', (gltf) => {
    const raw = gltf.scene;
    const box = new THREE.Box3().setFromObject(raw);
    const size = new THREE.Vector3();
    box.getSize(size);
    const targetHeight = 1.85;
    const scale = size.y > 0.001 ? targetHeight / size.y : 1;
    raw.scale.setScalar(scale);
    const box2 = new THREE.Box3().setFromObject(raw);
    raw.position.y -= box2.min.y;
    const center = new THREE.Vector3();
    box2.getCenter(center);
    raw.position.x -= center.x;
    raw.position.z -= center.z;
    raw.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    swatBodyTemplate = raw;
    // retroactively apply to any SWAT officers already on the field
    officers.forEach(o => { if (o.kind === 'swat') applySwatModel(o.mesh); });
    setMessage('SWAT装備を適用しました', 1500);
  }, (err) => { console.warn('SWAT model failed to load, using default look', err); });
}

    b.formationAngle += dt * 0.15;
    const followDist = 3.2;
    const targetX = player.pos.x + Math.sin(player.heading + Math.PI + b.formationAngle*0.3) * followDist;
    const targetZ = player.pos.z + Math.cos(player.heading + Math.PI + b.formationAngle*0.3) * followDist;
    const dx = targetX - b.pos.x, dz = targetZ - b.pos.z;
    const dist = Math.hypot(dx, dz);
    const spd = Math.min(6, dist * 1.5);
    if (dist > 0.3){
      const targetHeading = Math.atan2(dx, dz);
      let diff = targetHeading - b.heading;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;
      b.heading += diff * Math.min(1, dt*4);
      b.speed += (spd - b.speed) * Math.min(1, dt*3);
      const mx = Math.sin(b.heading) * b.speed * dt;
      const mz = Math.cos(b.heading) * b.speed * dt;
      if (!hitsBuilding(b.pos.x+mx, b.pos.z+mz, b.radius)){
        b.pos.x += mx; b.pos.z += mz;
      }
    } else {
      b.speed *= 0.8;
    }
    b.mesh.position.set(b.pos.x, 0, b.pos.z);
    b.mesh.rotation.y = b.heading;

  });

function updateJgmVehicle(dt){
  if (!bodyguardMode || !jgmVehicle.mesh || !jgmVehicle.mesh.visible) return;
  const v = jgmVehicle;
  // trail a set distance behind the player
  const backAng = player.heading + Math.PI;
  const targetX = player.pos.x + Math.sin(backAng)*9;
  const targetZ = player.pos.z + Math.cos(backAng)*9;
  const dx = targetX - v.pos.x, dz = targetZ - v.pos.z;
  const dist = Math.hypot(dx, dz);
  if (dist > 1.2){
    const targetHeading = Math.atan2(dx, dz);
    let diff = targetHeading - v.heading;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    v.heading += diff * Math.min(1, dt*2.6);
    const desired = Math.min(24, dist * 2.2);
    v.speed += (desired - v.speed) * Math.min(1, dt*2.2);
    const mx = Math.sin(v.heading) * v.speed * dt;
    const mz = Math.cos(v.heading) * v.speed * dt;
    if (!hitsBuilding(v.pos.x+mx, v.pos.z+mz, v.radius)){
      v.pos.x += mx; v.pos.z += mz;
    } else {
      v.heading += 1.1;
    }
  } else {
    v.speed *= 0.85;
  }
  v.mesh.position.set(v.pos.x, 0, v.pos.z);
  v.mesh.rotation.y = v.heading;
  const s = v.mesh.userData.siren;
  if (s){
    v.sirenT += dt;
    const on = Math.floor(v.sirenT*4) % 2 === 0;
    s.red.material.emissiveIntensity = on ? 1.8 : 0.1;
    s.blue.material.emissiveIntensity = on ? 0.1 : 1.8;
  }
}

// Police cars, SWAT vans (Bearcats), and Army Humvees (ground vehicles)
const police = []; // cop cars
const swatVans = []; // SWAT Bearcats
const armyVans = []; // Army Humvees
function vehicleListFor(kind){
  if (kind === 'swat') return swatVans;
  if (kind === 'army') return armyVans;
  return police;
}
function policeCapForWanted(w){ return Math.min(w, 6); } // 1 star = 1 car, caps at 6
function swatCapForWanted(w){
  if (w >= 6) return 2;
  if (w >= 5) return 1;
  return 0;
}
function armyCapForWanted(w){
  if (w >= 10) return 3;
  if (w >= 9) return 2;
  if (w >= 8) return 1;
  return 0;
}
function capForKind(kind){
  if (kind === 'swat') return swatCapForWanted(wanted);
  if (kind === 'army') return armyCapForWanted(wanted);
  return policeCapForWanted(wanted);
}
function spawnVehicle(kind){
  const list = vehicleListFor(kind);
  const cap = capForKind(kind);
  if (list.length >= cap) return;
  const ang = Math.random()*Math.PI*2;
  const r = 36;
  const x = player.pos.x + Math.cos(ang)*r;
  const z = player.pos.z + Math.sin(ang)*r;
  let mesh;
  if (kind === 'swat') mesh = makeBearcat();
  else if (kind === 'army') mesh = makeHumvee();
  else mesh = makeCar(0xffffff, true, 'POLICE');
  mesh.position.set(x, 0, z);
  mesh.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(mesh);
  if (kind === 'swat') applyMrapModel(mesh);
  list.push({ mesh, pos: {x, z}, heading: 0, speed: 0, radius: 1.6,
    health: kind === 'army' ? 7 : kind === 'swat' ? 5 : 2, officers: [], kind });
}
function alertNearbyPatrol(){
  const ALERT_RADIUS = 45;
  patrolVehicles.slice().forEach(v => {
    const d = Math.hypot(v.pos.x - player.pos.x, v.pos.z - player.pos.z);
    if (d > ALERT_RADIUS) return;
    const list = vehicleListFor(v.kind);
    const idx = patrolVehicles.indexOf(v);
    if (idx >= 0) patrolVehicles.splice(idx, 1);
    // silence the lazy patrol siren blink so the urgent chase flash takes over cleanly
    const s = v.mesh.userData.siren;
    if (s){ s.red.material.emissiveIntensity = 0.1; s.blue.material.emissiveIntensity = 0.1; }
    list.push({ mesh: v.mesh, pos: v.pos, heading: v.heading, speed: v.speed, radius: 1.6,
      health: v.kind === 'swat' ? 5 : 2, officers: [], kind: v.kind });
    setMessage('近くのパトカーに見つかった！', 1400);
  });
}
function destroyVehicle(v){
  const list = vehicleListFor(v.kind);
  const i = list.indexOf(v);
  if (i >= 0) list.splice(i, 1);
  while (v.officers.length) destroyOfficer(v.officers[0]);
  scene.remove(v.mesh);
}
function despawnOneVehicle(kind){
  const list = vehicleListFor(kind);
  const v = list.pop();
  if (!v) return;
  while (v.officers.length) destroyOfficer(v.officers[0]);
  scene.remove(v.mesh);
}
function clearAllVehicles(kind){
  const list = vehicleListFor(kind);
  while (list.length) despawnOneVehicle(kind);
}

}
function clearAllHelis(){

}
function growForceSpawns(){
  while (police.length < policeCapForWanted(wanted)) spawnVehicle('cop');
  while (swatVans.length < swatCapForWanted(wanted)) spawnVehicle('swat');
  while (armyVans.length < armyCapForWanted(wanted)) spawnVehicle('army');
  while (helicopters.length < heliCapForWanted(wanted)) spawnHelicopter();
  // note: deliberately does NOT shrink existing forces below cap here — a
  // patrol car that just got alerted (e.g. a SWAT van converted at low
  // wanted, before its combat cap normally unlocks) must not be instantly
  // despawned again. Shrinking only happens gradually via wanted decay.
}
function syncForceSpawns(){
  growForceSpawns();

// Safety net: guarantee the spawn point is never physically blocked by any
// generated building/tree/rock/etc, no matter where it landed.
(function clearSpawnArea(){
  const SPAWN_CLEAR_RADIUS = 26;
  for (let i = buildings.length - 1; i >= 0; i--){
    const b = buildings[i];
    const dx = Math.abs(b.x - SPAWN.x), dz = Math.abs(b.z - SPAWN.z);
    if (dx < b.hx + SPAWN_CLEAR_RADIUS && dz < b.hz + SPAWN_CLEAR_RADIUS){
      buildings.splice(i, 1);
    }
  }
})();

let audioCtx = null;
function getAudioCtx(){
  if (!audioCtx){
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e){ return null; }
  }
  // the context can get suspended again later (tab backgrounded, screen
  // lock, some mobile power-saving policies) - always try to resume it
  // whenever something wants to play a sound, not just on first unlock
  if (audioCtx.state === 'suspended'){
    audioCtx.resume().catch(()=>{});
  }
  return audioCtx;
}
function unlockAudio(){
  getAudioCtx();
}
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', unlockAudio);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) unlockAudio();
});

function playGunshot(weaponKey){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const dur = weaponKey === 'sniper' ? 0.22 : 0.14;
  const bufferSize = Math.floor(ctx.sampleRate * dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<bufferSize;i++){
    data[i] = (Math.random()*2 - 1) * Math.pow(1 - i/bufferSize, 2.2);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = weaponKey === 'sniper' ? 2400 : weaponKey === 'shotgun' ? 1200 : 3000;
  const gain = ctx.createGain();
  const peak = weaponKey === 'sniper' ? 0.9 : weaponKey === 'shotgun' ? 0.85 : 0.55;
  gain.gain.setValueAtTime(peak, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
  noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  noise.start(now);
  noise.stop(now + dur);
}

function playPunch(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(140, now);
  osc.frequency.exponentialRampToValueAtTime(45, now + 0.09);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.5, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.13);
}

function playThud(){ // for landing/busted moments
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  osc.type = 'square';
  osc.frequency.setValueAtTime(180, now);
  osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.35, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(now); osc.stop(now + 0.35);
}

function playCashRegister(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  [880, 1320, 1760].forEach((freq, i) => {
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const gain = ctx.createGain();
    const t0 = now + i*0.06;
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.linearRampToValueAtTime(0.22, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + 0.24);
  });
}

// continuous engine hum, modulated by the active vehicle's speed
let engineOsc = null, engineGain = null, engineFilter = null;
function ensureEngineAudio(){
  const ctx = getAudioCtx();
  if (!ctx || engineOsc) return;
  engineOsc = ctx.createOscillator();
  engineOsc.type = 'sawtooth';
  engineFilter = ctx.createBiquadFilter();
  engineFilter.type = 'lowpass';
  engineFilter.frequency.value = 500;
  engineGain = ctx.createGain();
  engineGain.gain.value = 0;
  engineOsc.connect(engineFilter);
  engineFilter.connect(engineGain);
  engineGain.connect(ctx.destination);
  engineOsc.frequency.value = 55;
  try { engineOsc.start(); } catch(e){}
}
function updateEngineAudio(){
  const ctx = getAudioCtx();
  if (!ctx) return;
  ensureEngineAudio();
  if (!engineGain) return;
  let speed = 0;
  if (mode === 'car' && activeCar) speed = Math.abs(activeCar.speed);
  else if (mode === 'plane') speed = Math.abs(playerPlane.speed) * 0.6;
  const targetGain = (mode === 'car' || mode === 'plane') ? Math.min(0.16, 0.04 + speed*0.006) : 0;
  const targetFreq = 55 + speed*4.5;
  const now = ctx.currentTime;
  engineGain.gain.setTargetAtTime(targetGain, now, 0.1);
  engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.1);
}

let sirenAmpLfo = null, sirenAmpLfoGain = null;
let sirenPhase = 0;
function ensureSirenAudio(){
  const ctx = getAudioCtx();
  if (!ctx || sirenOsc) return;
  // main tone (wail sweep) + a slightly detuned partner for thickness + a
  // quiet sawtooth layer for the harsh "electronic horn" edge real sirens have
  sirenOsc = ctx.createOscillator();
  sirenOsc.type = 'sine';
  sirenOsc2 = ctx.createOscillator();
  sirenOsc2.type = 'sine';
  sirenOsc3 = ctx.createOscillator();
  sirenOsc3.type = 'sawtooth';
  const sawGain = ctx.createGain();
  sawGain.gain.value = 0.22;

  sirenFilter = ctx.createBiquadFilter();
  sirenFilter.type = 'bandpass';
  sirenFilter.frequency.value = 800;
  sirenFilter.Q.value = 1.4;

  sirenGain = ctx.createGain();
  sirenGain.gain.value = 0;

  sirenOsc.connect(sirenFilter);
  sirenOsc2.connect(sirenFilter);
  sirenOsc3.connect(sawGain);
  sawGain.connect(sirenFilter);
  sirenFilter.connect(sirenGain);
  sirenGain.connect(ctx.destination);

  // slow amplitude warble so the wail doesn't sound like a flat constant tone
  sirenAmpLfo = ctx.createOscillator();
  sirenAmpLfo.type = 'sine';
  sirenAmpLfo.frequency.value = 5.5;
  sirenAmpLfoGain = ctx.createGain();
  sirenAmpLfoGain.gain.value = 0.04;
  sirenAmpLfo.connect(sirenAmpLfoGain);
  sirenAmpLfoGain.connect(sirenGain.gain);

  sirenOsc.frequency.value = 700;
  sirenOsc2.frequency.value = 700;
  sirenOsc3.frequency.value = 700;
  try { sirenOsc.start(); sirenOsc2.start(); sirenOsc3.start(); sirenAmpLfo.start(); } catch(e){}
}
function updateSirenAudio(dt){
  const ctx = getAudioCtx();
  if (!ctx) return;
  ensureSirenAudio();
  if (!sirenGain) return;
  let nearestDist = Infinity;
  police.concat(swatVans).concat(armyVans).forEach(v => {
    if (v.officers.length > 0) return; // parked/empty, not actively chasing
    const d = Math.hypot(v.pos.x - player.pos.x, v.pos.z - player.pos.z);
    if (d < nearestDist) nearestDist = d;
  });
  const active = wanted > 0 && nearestDist < 70;
  const proximity = active ? Math.max(0, 1 - nearestDist/70) : 0;
  const targetGain = active ? 0.045 + proximity*0.15 : 0;
  const now = ctx.currentTime;
  sirenGain.gain.setTargetAtTime(targetGain, now, 0.25);
  if (active){
    // slow, wide wail sweep (roughly a 2.4s cycle) like a real siren, not a fast wobble
    sirenPhase += dt * 2.6;
    const wail = (Math.sin(sirenPhase) + 1) / 2; // 0..1 smooth triangle-ish sweep
    const freq = 480 + wail*820; // sweeps ~480Hz to ~1300Hz
    sirenOsc.frequency.setTargetAtTime(freq, now, 0.05);
    sirenOsc2.frequency.setTargetAtTime(freq*1.006, now, 0.05); // slight detune for a fuller wail
    sirenOsc3.frequency.setTargetAtTime(freq*0.5, now, 0.05); // an octave down for body/grit
    sirenFilter.frequency.setTargetAtTime(freq*1.1, now, 0.05);
  }
}

function updateHealthUI(){
  const pct = Math.max(0, Math.min(100, (player.health / player.maxHealth) * 100));
  document.getElementById('healthBarFill').style.width = pct + '%';
}
let hitFlashTimer = 0;
function damagePlayer(amount){
  if (creativeMode) return;
  if (player.invuln > 0 || bustedCooldown > 0) return;
  player.health = Math.max(0, player.health - amount);
  updateHealthUI();
  hitFlashTimer = 0.35;
  document.getElementById('hitFlash').classList.add('show');
  if (player.health <= 0) playerWasted();
}
let healthRegenTimer = 0;
function updatePlayerHealth(dt){
  if (hitFlashTimer > 0){
    hitFlashTimer -= dt;
    if (hitFlashTimer <= 0) document.getElementById('hitFlash').classList.remove('show');
  }
  if (player.health < player.maxHealth && player.health > 0){
    healthRegenTimer += dt;
    if (healthRegenTimer > 6){ // slow passive regen once out of danger for a while
      player.health = Math.min(player.maxHealth, player.health + dt*3);
      updateHealthUI();
    }
  } else {
    healthRegenTimer = 0;
  }
  if (elapsed - lastOffenseTime < 6) healthRegenTimer = 0;
}

// ---------------------------------------------------------------------------
// OFFICER GUNFIRE (police/SWAT/army shoot back at the player when close)
// ---------------------------------------------------------------------------
function officerFireAt(o){
  const dx = player.pos.x - o.pos.x, dz = player.pos.z - o.pos.z;
  const dist = Math.hypot(dx, dz) || 1;
  const dir = { x: dx/dist, z: dz/dist };
  fireTracer({ x: o.pos.x + dir.x*0.5, y: 1.1, z: o.pos.z + dir.z*0.5 }, dir, dist);
  if (o.loadout === 'shotgun'){
    playGunshot('shotgun');
    if (Math.random() < 0.6) damagePlayer(11);
    return;
  }
  playGunshot(o.kind === 'army' || o.kind === 'swat' ? 'rifle' : 'pistol');
  const hitChance = o.kind === 'army' ? 0.55 : o.kind === 'swat' ? 0.42 : 0.28;
  if (Math.random() < hitChance){
    const dmg = o.kind === 'army' ? 13 : o.kind === 'swat' ? 9 : 5;
    damagePlayer(dmg);
  }
}
const OFFICER_SHOOT_RANGE = 22;
const SHOTGUN_OFFICER_RANGE = 11;
function updateOfficerCombat(dt){
  officers.forEach(o => {
    if (o.loadout === 'shield') return; // shield bearers advance and block, they don't fire
    if (o.shootCooldown === undefined) o.shootCooldown = 0.4 + Math.random()*1.2;
    o.shootCooldown -= dt;
    const dist = Math.hypot(player.pos.x - o.pos.x, player.pos.z - o.pos.z);
    const range = o.loadout === 'shotgun' ? SHOTGUN_OFFICER_RANGE : OFFICER_SHOOT_RANGE;
    const grounded = mode !== 'plane' || playerPlane.altitude < 8;
    if (grounded && dist < range && dist > 1.6 && o.shootCooldown <= 0){
      o.shootCooldown = o.loadout === 'shotgun' ? 1.1 + Math.random()*0.5
        : o.kind === 'army' ? 0.6 + Math.random()*0.4
        : o.kind === 'swat' ? 0.8 + Math.random()*0.5
        : 1.2 + Math.random()*0.6;
      officerFireAt(o);
    }
  });
}

const input = { steer: 0, throttle: 0 };

(function setupJoystick(){
  const base = document.getElementById('joyBase');
  const stick = document.getElementById('joyStick');
  let active = false, startX=0, startY=0, id=null;
  const maxR = 42;

  function onDown(e){
    active = true; id = e.pointerId;
    const r = base.getBoundingClientRect();
    startX = r.left + r.width/2; startY = r.top + r.height/2;
    base.setPointerCapture(id);
  }
  function onMove(e){
    if (!active || e.pointerId !== id) return;
    let dx = e.clientX - startX, dy = e.clientY - startY;
    const d = Math.hypot(dx,dy);
    if (d > maxR){ dx = dx/d*maxR; dy = dy/d*maxR; }
    stick.style.left = (40+dx) + 'px';
    stick.style.top = (40+dy) + 'px';
    input.steer = dx/maxR;
    input.throttle = -dy/maxR;
  }
  function onUp(e){
    if (e.pointerId !== id) return;
    active = false; id = null;
    stick.style.left = '40px'; stick.style.top = '40px';
    input.steer = 0; input.throttle = 0;
  }
  base.addEventListener('pointerdown', onDown);
  base.addEventListener('pointermove', onMove);
  base.addEventListener('pointerup', onUp);
  base.addEventListener('pointercancel', onUp);
})();

function handleEnterPress(){
  if (mode === 'car'){ exitCar(); return; }
  if (mode === 'plane'){ exitPlane(); return; }
  if (mode === 'mecha'){ exitMecha(); return; }
  if (!nearestInteractable) return;
  if (nearestInteractable.type === 'shop') startRobbery(nearestInteractable.obj);
  else if (nearestInteractable.type === 'car') tryEnterCar();
  else if (nearestInteractable.type === 'trafficCar' || nearestInteractable.type === 'patrolCar') tryJackVehicle();
  else if (nearestInteractable.type === 'gunshop') enterGunShopInterior();
  else if (nearestInteractable.type === 'shopcounter') openShop();
  else if (nearestInteractable.type === 'shopexit') exitGunShopInterior();
  else if (nearestInteractable.type === 'station') enterPoliceStation();
  else if (nearestInteractable.type === 'stationexit') exitPoliceStation();
  else if (nearestInteractable.type === 'bankdoor') enterBankInterior(nearestInteractable.obj);
  else if (nearestInteractable.type === 'bankexit') exitBankInterior();
  else if (nearestInteractable.type === 'bankvault') startRobbery(nearestInteractable.obj, BANK_VAULT);
  else if (nearestInteractable.type === 'plane') tryEnterPlane();
  else if (nearestInteractable.type === 'npc') talkToNPC(nearestInteractable.obj);
}

function tryJackVehicle(){
  const veh = nearestInteractable && nearestInteractable.obj;
  const type = nearestInteractable && nearestInteractable.type;
  if (!veh) return;
  if (type === 'trafficCar'){
    const idx = trafficCars.indexOf(veh);
    if (idx >= 0) trafficCars.splice(idx, 1);
  } else if (type === 'patrolCar'){
    const idx = patrolVehicles.indexOf(veh);
    if (idx >= 0) patrolVehicles.splice(idx, 1);
    const s = veh.mesh.userData.siren;
    if (s){ s.red.material.emissiveIntensity = 0.1; s.blue.material.emissiveIntensity = 0.1; }
  } else {
    return;
  }
  veh.occupied = true;
  veh.radius = veh.radius || 1.6;
  cars.push(veh);
  mode = 'car';
  activeCar = veh;
  player.mesh.visible = false;
  clearAllOfficers();
  refreshButtonLabels();

  setMessage('乗っ取り成功！', 1000);
}

let usingKeyboard = false;
const keysDown = {};
const MOVE_KEYS = ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
window.addEventListener('keydown', (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return; // typing in a text field, don't treat as game input
  if (MOVE_KEYS.includes(e.code) || e.code === 'Space' || e.code === 'KeyE' || e.code === 'KeyQ'){
    usingKeyboard = true;
  }
  if (e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  keysDown[e.code] = true;
  if (e.code === 'Space') handlePunchDown();
  else if (e.code === 'KeyE') handleEnterPress();
  else if (e.code === 'KeyQ') handleWeaponSwitch();
});
window.addEventListener('keyup', (e) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  keysDown[e.code] = false;
  if (e.code === 'Space') handlePunchUp();
});
function applyKeyboardMovement(){
  if (!usingKeyboard) return;
  let steer = 0, throttle = 0;
  if (keysDown['KeyW'] || keysDown['ArrowUp']) throttle += 1;
  if (keysDown['KeyS'] || keysDown['ArrowDown']) throttle -= 1;
  if (keysDown['KeyA'] || keysDown['ArrowLeft']) steer -= 1;
  if (keysDown['KeyD'] || keysDown['ArrowRight']) steer += 1;
  input.steer = steer;
  input.throttle = throttle;
}

function tryEnterCar(){

function exitCar(){
  if (!activeCar) return;
  activeCar.occupied = false;
  const exitAng = activeCar.heading + Math.PI/2;
  player.pos.x = activeCar.pos.x + Math.sin(exitAng)*2.2;
  player.pos.z = activeCar.pos.z + Math.cos(exitAng)*2.2;
  player.heading = activeCar.heading;
  player.mesh.visible = true;
  activeCar.speed = 0;
  activeCar = null;
  mode = 'foot';
  refreshButtonLabels();
  setMessage('ON FOOT', 900);
}

function doPunch(){
  if (player.punchTimer > 0) return;
  player.punchTimer = 0.35;
  playPunch();
  const arm = player.mesh.getObjectByName('punchArm');
  arm.visible = true;
  setTimeout(()=>{ arm.visible = false; }, 220);

  const fwd = { x: Math.sin(player.heading), z: Math.cos(player.heading) };
  npcs.forEach(n => {
    if (n.state !== 'walk') return;
    const dx = n.pos.x - player.pos.x, dz = n.pos.z - player.pos.z;
    const dist = Math.hypot(dx,dz);
    if (dist > 2.3) return;
    const dot = (dx/dist)*fwd.x + (dz/dist)*fwd.z;
    if (dot > 0.45){
      knockDown(n);
    }
  });
}

function knockDown(n, wantedAmount){
  n.state = 'down';
  n.downTimer = 5 + Math.random()*2;
  n.mesh.rotation.z = Math.PI/2;
  n.mesh.position.y = 0.35;
  addWanted(wantedAmount || 1);
  if (Math.random() < 0.7) spawnCashPickup(n.pos.x + (Math.random()-0.5)*1.5, n.pos.z + (Math.random()-0.5)*1.5, 20 + Math.floor(Math.random()*60));
}

function fireTracer(origin, dir, length){
  const end = { x: origin.x + dir.x*length, y: origin.y - 0.3, z: origin.z + dir.z*length };
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(origin.x, origin.y, origin.z),
    new THREE.Vector3(end.x, end.y, end.z)
  ]);
  const mat = new THREE.LineBasicMaterial({ color: 0xfff2a0, transparent: true, opacity: 0.9 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  setTimeout(()=> scene.remove(line), 70);
}

function spawnMuzzleFlash(origin, dir){
  const flash = new THREE.Mesh(
    new THREE.CircleGeometry(0.4, 8),
    new THREE.MeshBasicMaterial({
      color: 0xfff2a0, transparent: true, opacity: 0.95,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  flash.position.set(origin.x, origin.y, origin.z);
  flash.lookAt(origin.x + dir.x, origin.y, origin.z + dir.z);
  scene.add(flash);
  const glow = new THREE.PointLight(0xffdd88, 3.5, 6, 2);
  glow.position.set(origin.x, origin.y, origin.z);
  scene.add(glow);
  setTimeout(()=> { scene.remove(flash); scene.remove(glow); }, 45);
}

function doShoot(){
  if (weaponMode === 'fist') return;
  if (shootCooldown > 0) return;
  const stats = WEAPONS[weaponMode];
  if (ammo[weaponMode] <= 0){
    setMessage('弾切れ！', 1000);
    weaponMode = 'fist';
    setWeaponVisuals();
    weaponBtn.textContent = 'FIST';
    firingHeld = false;
    refreshButtonLabels();
    return;
  }
  shootCooldown = stats.cooldown;
  ammo[weaponMode]--; updateAmmoUI();
  playGunshot(weaponMode);
  if (weaponMode === 'minigun'){
    const mg = player.mesh.getObjectByName('minigunModel');
    if (mg && mg.userData.barrelCluster) mg.userData.barrelCluster.rotation.z += 0.9;
  }

  const baseHeading = player.heading;
  const RANGE = stats.range;
  const policeDamage = stats.policeDmg;
  const pelletCount = stats.pellets || 1;
  const spread = pelletCount > 1 ? 0.16 : 0; // radians of random spread per pellet (shotgun)

  {
    const muzzleFwd = { x: Math.sin(baseHeading), z: Math.cos(baseHeading) };
    spawnMuzzleFlash({
      x: player.pos.x + muzzleFwd.x*0.7, y: 1.1, z: player.pos.z + muzzleFwd.z*0.7
    }, muzzleFwd);
  }

  for (let p=0; p<pelletCount; p++){
    const heading = baseHeading + (spread ? (Math.random()-0.5)*spread : 0);
    const fwd = { x: Math.sin(heading), z: Math.cos(heading) };
    const origin = {
      x: player.pos.x + fwd.x*0.6,
      y: 1.1,
      z: player.pos.z + fwd.z*0.6
    };
    fireTracer(origin, fwd, RANGE);

    const COS_LIMIT = stats.cone;
    npcs.forEach(n => {
      if (n.state !== 'walk') return;
      const dx = n.pos.x - player.pos.x, dz = n.pos.z - player.pos.z;
      const dist = Math.hypot(dx,dz);
      if (dist > RANGE) return;
      const dot = (dx/dist)*fwd.x + (dz/dist)*fwd.z;
      if (dot > COS_LIMIT) knockDown(n, stats.wantedHit);
    });
    police.concat(swatVans).concat(armyVans).slice().forEach(v => {
      const dx = v.pos.x - player.pos.x, dz = v.pos.z - player.pos.z;
      const dist = Math.hypot(dx,dz);
      if (dist > RANGE) return;
      const dot = (dx/dist)*fwd.x + (dz/dist)*fwd.z;
      if (dot > COS_LIMIT){
        v.health -= policeDamage;
        if (v.health <= 0) destroyVehicle(v);
      }
    });
    officers.slice().forEach(o => {
      const dx = o.pos.x - player.pos.x, dz = o.pos.z - player.pos.z;
      const dist = Math.hypot(dx,dz);
      if (dist > RANGE) return;
      const dot = (dx/dist)*fwd.x + (dz/dist)*fwd.z;
      if (dot > COS_LIMIT){
        o.health -= policeDamage;
        if (o.health <= 0) destroyOfficer(o);
      }
    });
  }
}

let currentRobberyAnchor = null; // ground position used for the distance/cancel check - the vault, not the far-away exterior door, while robbing a bank from inside
function startRobbery(shop, anchor){
  if (shop.robbed || shop.robbing) return;
  currentRobbery = shop;
  currentRobberyAnchor = anchor || shop.pos;
  shop.robbing = true;
  shop.progress = 0;
  player.robbing = true;
  document.getElementById('robLabel').textContent = shop.type === 'bank' ? 'ROBBING VAULT...' : 'ROBBING...';
  document.getElementById('robBar').classList.add('show');
  document.getElementById('robLabel').classList.add('show');
  if (shop.type === 'bank') setMessage('サイレントアラームが作動した！', 1400);
}
function cancelRobbery(msg){
  if (!currentRobbery) return;
  currentRobbery.robbing = false;
  currentRobbery.progress = 0;
  currentRobbery = null;
  currentRobberyAnchor = null;
  player.robbing = false;
  document.getElementById('robBar').classList.remove('show');
  document.getElementById('robLabel').classList.remove('show');
  if (msg) setMessage(msg, 1200);
}
function updateRobbery(dt){
  if (!currentRobbery) return;
  const shop = currentRobbery;
  const anchor = currentRobberyAnchor || shop.pos;
  const dist = Math.hypot(player.pos.x-anchor.x, player.pos.z-anchor.z);
  const moving = Math.hypot(input.steer, input.throttle) > 0.5;
  if (mode !== 'foot' || dist > shop.radius + 2.5 || moving){
    cancelRobbery('強盗中断');
    return;
  }
  shop.progress += dt / shop.duration;
  document.getElementById('robFill').style.width = Math.min(100, shop.progress*100) + '%';
  if (shop.progress >= 1){
    shop.robbing = false;
    shop.robbed = true;
    shop.cooldown = shop.cooldownTime;
    shop.marker.visible = false;
    currentRobbery = null;
    currentRobberyAnchor = null;
    player.robbing = false;
    document.getElementById('robBar').classList.remove('show');
    document.getElementById('robLabel').classList.remove('show');
    const reward = shop.rewardMin + Math.floor(Math.random()*(shop.rewardMax - shop.rewardMin));
    money += reward;
    updateMoneyUI();
    playCashRegister();
    setMessage((shop.type === 'bank' ? '金庫をこじ開けた！ +$' : '強盗成功！ +$') + reward.toLocaleString(), 2000);
    addWanted(shop.wantedGain);
  }
}
function updateShops(dt){
  shops.forEach(s => {
    if (!s.robbing) s.marker.rotation.y += dt*1.8;
    if (s.robbed){
      s.cooldown -= dt;
      if (s.cooldown <= 0){
        s.robbed = false;
        s.marker.visible = true;
      }
    }
  });
  bankBranches.forEach(s => {
    if (!s.robbing) s.marker.rotation.y += dt*1.2;
    if (s.robbed){
      s.cooldown -= dt;
      if (s.cooldown <= 0){
        s.robbed = false;
        s.marker.visible = true;
      }
    }
  });
  gunShops.forEach(gs => { gs.marker.rotation.y += dt*2.2; gs.marker.rotation.x += dt*1.1; });
}

const cashPickups = []; // {mesh, pos, amount, life}
function spawnCashPickup(x, z, amount){
  const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0),
    new THREE.MeshStandardMaterial({ color: 0x7dff8a, emissive: 0x2f8a3a, emissiveIntensity: 0.8 }));
  mesh.position.set(x, 0.5, z);
  scene.add(mesh);
  cashPickups.push({ mesh, pos: { x, z }, amount, life: 12 });
}
function updateCashPickups(dt){
  for (let i = cashPickups.length-1; i>=0; i--){
    const c = cashPickups[i];
    c.mesh.rotation.y += dt*2.4;
    c.mesh.position.y = 0.5 + Math.sin(elapsed*3 + i)*0.08;
    c.life -= dt;
    let taken = c.life <= 0;
    if (!taken && mode === 'foot'){
      const d = Math.hypot(player.pos.x-c.pos.x, player.pos.z-c.pos.z);
      if (d < 1.4){
        money += c.amount;
        updateMoneyUI();
        playCashRegister();
        setMessage('+$' + c.amount.toLocaleString(), 700);
        taken = true;
      }
    }
    if (taken){
      scene.remove(c.mesh);
      cashPickups.splice(i, 1);
    }
  }
}

let taxiFare = null; // {npc, marker, destination:{x,z}, destMarker}
let hasPassenger = false;
let taxiSpawnTimer = 6;
function spawnTaxiFare(){
  const candidates = npcs.filter(n => n.state === 'walk');
  if (!candidates.length) return;
  const npc = candidates[(Math.random()*candidates.length)|0];
  npc.state = 'waitingFare';
  const marker = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.55, 6),
    new THREE.MeshStandardMaterial({ color: 0xffe23f, emissive: 0xffaa00, emissiveIntensity: 0.9 }));
  marker.position.set(npc.pos.x, 2.3, npc.pos.z);
  marker.rotation.x = Math.PI;
  scene.add(marker);
  const destAng = Math.random()*Math.PI*2;
  const destR = 40 + Math.random()*(CITY_HALF-50);
  const destX = Math.max(-CITY_HALF+15, Math.min(CITY_HALF-15, Math.cos(destAng)*destR));
  const destZ = Math.max(-CITY_HALF+15, Math.min(CITY_HALF-15, Math.sin(destAng)*destR));
  const destMarker = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 7, 6),
    new THREE.MeshStandardMaterial({ color: 0x4de1ff, emissive: 0x2299ff, emissiveIntensity: 0.7, transparent: true, opacity: 0.75 }));
  destMarker.position.set(destX, 3.5, destZ);
  destMarker.visible = false;
  scene.add(destMarker);
  taxiFare = { npc, marker, destination: { x: destX, z: destZ }, destMarker };
}
function updateTaxi(dt){
  if (!taxiFare && !hasPassenger){
    taxiSpawnTimer -= dt;
    if (taxiSpawnTimer <= 0){
      taxiSpawnTimer = 25 + Math.random()*20;
      spawnTaxiFare();
    }
    return;
  }
  if (!taxiFare) return;
  if (!hasPassenger){
    taxiFare.marker.position.y = 2.1 + Math.sin(elapsed*3)*0.15;
    taxiFare.marker.rotation.y += dt*2.4;
    if (mode === 'car' && activeCar){
      const d = Math.hypot(activeCar.pos.x - taxiFare.npc.pos.x, activeCar.pos.z - taxiFare.npc.pos.z);
      if (d < 4.5){
        hasPassenger = true;
        scene.remove(taxiFare.marker);
        taxiFare.npc.mesh.visible = false;
        taxiFare.npc.state = 'riding';
        taxiFare.destMarker.visible = true;
        setMessage('お客さんを乗せた！目的地の青い光まで送ろう', 2200);
      }
    }
  } else {
    taxiFare.destMarker.rotation.y += dt*2;
    if (mode === 'car' && activeCar){
      const d = Math.hypot(activeCar.pos.x - taxiFare.destination.x, activeCar.pos.z - taxiFare.destination.z);
      if (d < 7){
        const reward = 300 + Math.floor(Math.random()*500);
        money += reward;
        updateMoneyUI();
        playCashRegister();
        setMessage('お客さんを送り届けた！ +$' + reward.toLocaleString(), 2000);
        scene.remove(taxiFare.destMarker);
        taxiFare.npc.mesh.visible = true;
        taxiFare.npc.state = 'walk';
        taxiFare.npc.pos.x = taxiFare.destination.x;
        taxiFare.npc.pos.z = taxiFare.destination.z;
        taxiFare.npc.mesh.position.set(taxiFare.npc.pos.x, 0, taxiFare.npc.pos.z);
        taxiFare = null;
        hasPassenger = false;
        taxiSpawnTimer = 20 + Math.random()*15;
      }
    }
  }
}
